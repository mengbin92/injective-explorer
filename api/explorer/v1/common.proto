syntax = "proto3";

package api.explorer.v1;

import "google/protobuf/struct.proto";

option go_package = "injective-explorer/api/explorer/v1;v1";
option java_multiple_files = true;
option java_package = "api.explorer.v1";

// Pagination request parameters (supports both page-based and cursor-based pagination)
message PaginationRequest {
  // Page number, starts from 1, default 1 (for page-based pagination)
  int32 page = 1;
  // Page size, default 20, maximum 100
  int32 page_size = 2 [ json_name = "page_size" ];
  // Cursor (for cursor-based pagination, optimized for large datasets, takes priority over page)
  // For blocks: use block height (height)
  // For transactions: use transaction number (tx_number) or combination of block height + transaction number
  string cursor = 3;
}

// Pagination response information
message PaginationInfo {
  // Current page number
  int32 page = 1;
  // Page size
  int32 page_size = 2 [ json_name = "page_size" ];
  // Total number of records
  int64 total = 3;
  // Total number of pages
  int32 total_pages = 4 [ json_name = "total_pages" ];
  // Whether there is a previous page
  bool has_prev = 5 [ json_name = "has_prev" ];
  // Whether there is a next page
  bool has_next = 6 [ json_name = "has_next" ];
}

// Generic response structure
message Reply {
  // Response status code, 0 indicates success, non-zero indicates failure
  int32 code = 1;
  // Response message
  string message = 2;
  // Response data (using Struct type to directly return JSON objects, more intuitive)
  google.protobuf.Struct data = 3;
}
