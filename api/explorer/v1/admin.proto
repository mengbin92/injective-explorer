syntax = "proto3";

package api.explorer.v1;

import "explorer/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "injective-explorer/api/explorer/v1;v1";
option java_multiple_files = true;
option java_package = "api.explorer.v1";

// AdminService provides admin management services for API plans, IP management,
// and email blacklist
service AdminService {
  // ========== Plan Management ==========
  // GetPlan gets a plan by ID
  rpc GetPlan(GetPlanRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/plan"
    };
  }

  // ListPlans lists all plans
  rpc ListPlans(ListPlansRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/plans"
    };
  }

  // CreatePlan creates a new plan
  rpc CreatePlan(CreatePlanRequest) returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/admin/plans"
      body : "*"
    };
  }

  // UpdatePlan updates a plan configuration
  rpc UpdatePlan(UpdatePlanRequest) returns (Reply) {
    option (google.api.http) = {
      put : "/api/v1/admin/plans"
      body : "*"
    };
  }

  // GetPlanStats gets plan usage statistics
  rpc GetPlanStats(GetPlanStatsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/plans/stats"
    };
  }

  // SwitchPlan switches a user's plan to a different plan
  rpc SwitchPlan(SwitchPlanRequest) returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/admin/plans/switch"
      body : "*"
    };
  }

  // PublishPlan publishes a plan (set status to active)
  rpc PublishPlan(PublishPlanRequest) returns (Reply) {
    option (google.api.http) = {
      put : "/api/v1/admin/plans/publish"
      body : "*"
    };
  }

  // UnpublishPlan unpublishes a plan (set status to inactive)
  rpc UnpublishPlan(UnpublishPlanRequest) returns (Reply) {
    option (google.api.http) = {
      put : "/api/v1/admin/plans/unpublish"
      body : "*"
    };
  }

  // ========== IP Management ==========
  // ListIPRegistrationRecords lists IP registration records
  rpc ListIPRegistrationRecords(ListIPRegistrationRecordsRequest)
      returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/ip/records"
    };
  }

  // GetIPDetail gets IP detail information
  rpc GetIPDetail(GetIPDetailRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/ip/detail"
    };
  }

  // ListIPBlacklist lists IP blacklist
  rpc ListIPBlacklist(ListIPBlacklistRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/ip/blacklist"
    };
  }

  // AddIPToBlacklist adds an IP to blacklist
  rpc AddIPToBlacklist(AddIPToBlacklistRequest) returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/admin/ip/blacklist"
      body : "*"
    };
  }

  // RemoveIPFromBlacklist removes an IP from blacklist
  rpc RemoveIPFromBlacklist(RemoveIPFromBlacklistRequest) returns (Reply) {
    option (google.api.http) = {
      delete : "/api/v1/admin/ip/blacklist"
    };
  }

  // BatchAddIPToBlacklist batch adds IPs to blacklist
  rpc BatchAddIPToBlacklist(BatchAddIPToBlacklistRequest) returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/admin/ip/blacklist/batch"
      body : "*"
    };
  }

  // BatchRemoveIPFromBlacklist batch removes IPs from blacklist
  rpc BatchRemoveIPFromBlacklist(BatchRemoveIPFromBlacklistRequest)
      returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/admin/ip/blacklist/batch-remove"
      body : "*"
    };
  }

  // GetIPRequestMonitor gets IP request monitoring data
  rpc GetIPRequestMonitor(GetIPRequestMonitorRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/ip/monitor"
    };
  }

  // GetIPRateLimitConfig gets IP rate limit configuration
  rpc GetIPRateLimitConfig(google.protobuf.Empty) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/ip/config"
    };
  }

  // UpdateIPRateLimitConfig updates IP rate limit configuration
  rpc UpdateIPRateLimitConfig(UpdateIPRateLimitConfigRequest) returns (Reply) {
    option (google.api.http) = {
      put : "/api/v1/admin/ip/config"
      body : "*"
    };
  }

  // GetIPRecordsStats gets IP registration records statistics
  rpc GetIPRecordsStats(GetIPRecordsStatsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/ip/records/stats"
    };
  }

  // GetIPBlacklistStats gets IP blacklist statistics
  rpc GetIPBlacklistStats(google.protobuf.Empty) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/ip/blacklist/stats"
    };
  }

  // ExportIPList exports IP list (records/blacklist/monitor)
  rpc ExportIPList(ExportIPListRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/ip/export"
    };
  }

  // GetUsageErrors gets error request list
  rpc GetUsageErrors(GetUsageErrorsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/usage/errors"
    };
  }

  // GetUsageStats gets usage statistics overview
  rpc GetUsageStats(GetUsageStatsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/usage/stats"
    };
  }

  // GetUsageTrends gets usage trends over time
  rpc GetUsageTrends(GetUsageTrendsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/usage/trends"
    };
  }

  // GetUsageByEndpoint gets usage statistics grouped by endpoint
  rpc GetUsageByEndpoint(GetUsageByEndpointRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/usage/by-endpoint"
    };
  }

  // GetUsageByErrorCode gets usage statistics grouped by error code
  rpc GetUsageByErrorCode(GetUsageByErrorCodeRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/usage/by-error-code"
    };
  }

  // ========== Email Blacklist Management ==========
  // ListEmailBlacklist lists email blacklist domains
  rpc ListEmailBlacklist(ListEmailBlacklistRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/email/blacklist"
    };
  }

  // AddEmailDomain adds an email domain to blacklist
  rpc AddEmailDomain(AddEmailDomainRequest) returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/admin/email/blacklist"
      body : "*"
    };
  }

  // UpdateEmailDomain updates an email domain
  rpc UpdateEmailDomain(UpdateEmailDomainRequest) returns (Reply) {
    option (google.api.http) = {
      put : "/api/v1/admin/email/blacklist"
      body : "*"
    };
  }

  // DeleteEmailDomain deletes an email domain from blacklist
  rpc DeleteEmailDomain(DeleteEmailDomainRequest) returns (Reply) {
    option (google.api.http) = {
      delete : "/api/v1/admin/email/blacklist"
    };
  }

  // BatchImportEmailDomains batch imports email domains
  rpc BatchImportEmailDomains(BatchImportEmailDomainsRequest) returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/admin/email/blacklist/batch-import"
      body : "*"
    };
  }

  // ToggleEmailDomainStatus toggles email domain status (active/disabled)
  rpc ToggleEmailDomainStatus(ToggleEmailDomainStatusRequest) returns (Reply) {
    option (google.api.http) = {
      put : "/api/v1/admin/email/blacklist/toggle"
      body : "*"
    };
  }

  // GetEmailBlacklistStats gets email blacklist statistics
  rpc GetEmailBlacklistStats(google.protobuf.Empty) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/email/blacklist/stats"
    };
  }

  // PreviewImportEmailDomains previews batch import email domains
  rpc PreviewImportEmailDomains(PreviewImportEmailDomainsRequest)
      returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/admin/email/blacklist/preview-import"
      body : "*"
    };
  }

  // BatchDeleteEmailDomains batch deletes email domains
  rpc BatchDeleteEmailDomains(BatchDeleteEmailDomainsRequest) returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/admin/email/blacklist/batch-delete"
      body : "*"
    };
  }

  // ========== User Token Management ==========
  // ListUserTokens lists all tokens for a specific user
  rpc ListUserTokens(ListUserTokensRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/user/tokens"
    };
  }

  // GetUserTokenStats gets token statistics for a specific user
  rpc GetUserTokenStats(GetUserTokenStatsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/user/token-stats"
    };
  }

  // ========== Account Management ==========
  // ListAccounts lists all API accounts with search, filter, and pagination
  rpc ListAccounts(ListAccountsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/accounts"
    };
  }

  // GetAccountDetail gets detailed information for a specific API account
  rpc GetAccountDetail(GetAccountDetailRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/accounts/detail"
    };
  }

  // GetAccountStats gets API account statistics (total accounts, active
  // accounts, token count, etc.)
  rpc GetAccountStats(google.protobuf.Empty) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/accounts/stats"
    };
  }

  // ToggleAccountStatus enables or disables an account
  rpc ToggleAccountStatus(ToggleAccountStatusRequest) returns (Reply) {
    option (google.api.http) = {
      put : "/api/v1/admin/accounts/status"
      body : "*"
    };
  }

  // ExportAccounts exports account list to CSV/Excel format
  rpc ExportAccounts(ExportAccountsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/admin/accounts/export"
    };
  }

  // ToggleTokenStatus enables or disables a token
  rpc ToggleTokenStatus(ToggleTokenStatusRequest) returns (Reply) {
    option (google.api.http) = {
      put : "/api/v1/admin/tokens/status"
      body : "*"
    };
  }
}

// ========== Plan Management Messages ==========
message GetPlanRequest { uint64 id = 1; }

message ListPlansRequest {
  PaginationRequest pagination = 1;
  string plan_type = 2 [ json_name = "plan_type" ]; // free/paid
  string status = 3;                                // active/inactive
}

message CreatePlanRequest {
  string name = 1; // Plan name (required, unique)
  string plan_type = 2
      [ json_name = "plan_type" ]; // Plan type: free/paid (required)
  uint64 monthly_limit = 3
      [ json_name = "monthly_limit" ]; // Monthly call limit (required)
  int32 rate_limit_per_second = 4
      [ json_name =
            "rate_limit_per_second" ]; // Rate limit per second (required)
  int32 max_tokens = 5
      [ json_name = "max_tokens" ]; // Maximum number of tokens (required)
  bool enable_webhook = 6 [
    json_name = "enable_webhook"
  ];                      // Whether to enable webhook (optional, default false)
  double price = 7;       // Plan price (optional, default 0.00)
  string status = 8;      // Status: active/inactive (optional, default active)
  string description = 9; // Plan description (optional)
}

message UpdatePlanRequest {
  uint64 id = 1;
  string description = 2; // Plan description
  uint64 monthly_limit = 3
      [ json_name = "monthly_limit" ]; // Monthly call limit
  int32 rate_limit_per_second = 4
      [ json_name = "rate_limit_per_second" ];       // Rate limit per second
  int32 max_tokens = 5 [ json_name = "max_tokens" ]; // Maximum number of tokens
  double price = 6;                                  // Plan price
  string status = 7; // Plan status: active/inactive
  bool enable_webhook = 8
      [ json_name = "enable_webhook" ]; // Enable webhook feature
}

message GetPlanStatsRequest { uint64 id = 1; }

message SwitchPlanRequest {
  string user_id = 1 [ json_name = "user_id" ]; // User ID to switch plan for
  uint64 plan_id = 2 [ json_name = "plan_id" ]; // Target plan ID
}

message PublishPlanRequest {
  uint64 id = 1; // Plan ID to publish
}

message UnpublishPlanRequest {
  uint64 id = 1; // Plan ID to unpublish
}

message PlanStatsDTO {
  int64 token_count = 1 [ json_name = "token_count" ]; // Number of tokens
  int64 user_count = 2 [ json_name = "user_count" ];   // Number of users
}

message GetUsageStatsRequest {
  string time_range = 1 [ json_name = "time_range" ]; // today/7days/30days/all
}

message UsageStatsDTO {
  int64 total_requests = 1 [ json_name = "total_requests" ];
  int64 success_requests = 2 [ json_name = "success_requests" ];
  int64 failed_requests = 3 [ json_name = "failed_requests" ];
  double error_rate = 4 [ json_name = "error_rate" ]; // Error rate percentage
  double avg_response_time = 5
      [ json_name = "avg_response_time" ]; // Average response time in ms
  int64 unique_users = 6 [ json_name = "unique_users" ];
  int64 unique_ips = 7 [ json_name = "unique_ips" ];
}

message GetUsageTrendsRequest {
  string time_range = 1 [ json_name = "time_range" ]; // 7days/30days/90days
  string interval = 2;                                // day/week/month
}

message UsageTrendDTO {
  string date = 1; // Date in YYYY-MM-DD format
  int64 total_requests = 2 [ json_name = "total_requests" ];
  int64 success_requests = 3 [ json_name = "success_requests" ];
  int64 failed_requests = 4 [ json_name = "failed_requests" ];
  double avg_response_time = 5 [ json_name = "avg_response_time" ];
}

message GetUsageByEndpointRequest {
  string time_range = 1 [ json_name = "time_range" ]; // today/7days/30days/all
  int32 top_n = 2
      [ json_name =
            "top_n" ]; // Number of top endpoints to return (default: 10)
}

message EndpointUsageDTO {
  string endpoint = 1;
  string method = 2;
  int64 request_count = 3 [ json_name = "request_count" ];
  int64 success_count = 4 [ json_name = "success_count" ];
  int64 failed_count = 5 [ json_name = "failed_count" ];
  double error_rate = 6 [ json_name = "error_rate" ];
  double avg_response_time = 7 [ json_name = "avg_response_time" ];
}

message GetUsageByErrorCodeRequest {
  string time_range = 1 [ json_name = "time_range" ]; // today/7days/30days/all
}

message ErrorCodeUsageDTO {
  int32 status_code = 1 [ json_name = "status_code" ];
  int64 count = 2;
  double percentage = 3; // Percentage of total errors
  repeated string top_error_messages = 4
      [ json_name = "top_error_messages" ]; // Top 5 error messages
}

message PlanDTO {
  uint64 id = 1;
  string name = 2;
  string plan_type = 3 [ json_name = "plan_type" ];
  string description = 4;
  uint64 monthly_limit = 5 [ json_name = "monthly_limit" ];
  int32 rate_limit_per_second = 6 [ json_name = "rate_limit_per_second" ];
  int32 max_tokens = 7 [ json_name = "max_tokens" ];
  double price = 8;
  string status = 9; // Plan status: active/inactive
  bool is_enabled = 14
      [ json_name = "is_enabled" ]; // Boolean flag: true if status is active
  int64 token_count = 10
      [ json_name = "token_count" ]; // Number of tokens using this plan
  int64 user_count = 11
      [ json_name = "user_count" ]; // Number of users using this plan
  string created_at = 12 [ json_name = "created_at" ];
  string updated_at = 13 [ json_name = "updated_at" ];
}

// ========== IP Management Messages ==========
message ListIPRegistrationRecordsRequest {
  PaginationRequest pagination = 1;
  string ip_address = 2 [ json_name = "ip_address" ]; // Search IP address
  string status = 3;                                  // normal/blocked
  string time_range = 4 [ json_name = "time_range" ]; // today/7days/30days/all
  int32 min_register_count = 5
      [ json_name = "min_register_count" ]; // Minimum registration count
}

message GetIPDetailRequest {
  string ip_address = 1 [ json_name = "ip_address" ];
}

message ListIPBlacklistRequest {
  PaginationRequest pagination = 1;
  string ip_address = 2 [ json_name = "ip_address" ]; // Search IP address
}

message AddIPToBlacklistRequest {
  string ip_address = 1 [ json_name = "ip_address" ];
  string reason = 2; // batch_register/api_abuse/proxy/spam/other
  string reason_text = 3 [ json_name = "reason_text" ];
  string block_type = 4 [ json_name = "block_type" ]; // all/register/api
  string operator_id = 5 [ json_name = "operator_id" ];
  string operator_name = 6 [ json_name = "operator_name" ];
}

message RemoveIPFromBlacklistRequest {
  string ip_address = 1 [ json_name = "ip_address" ];
}

message BatchAddIPToBlacklistRequest {
  repeated string ip_addresses = 1 [ json_name = "ip_addresses" ];
  string reason = 2;
  string reason_text = 3 [ json_name = "reason_text" ];
  string block_type = 4 [ json_name = "block_type" ];
  string operator_id = 5 [ json_name = "operator_id" ];
  string operator_name = 6 [ json_name = "operator_name" ];
}

message BatchRemoveIPFromBlacklistRequest {
  repeated string ip_addresses = 1 [ json_name = "ip_addresses" ];
}

message GetIPRequestMonitorRequest {
  string time_range = 1 [ json_name = "time_range" ]; // 1h/6h/24h/7d
  string ip_address = 2 [ json_name = "ip_address" ]; // Search IP address
}

message UpdateIPRateLimitConfigRequest {
  int32 ip_per_minute = 1
      [ json_name = "ip_per_minute" ]; // Requests per minute limit
  int32 ip_per_hour = 2
      [ json_name = "ip_per_hour" ]; // Requests per hour limit
  string block_type = 3
      [ json_name =
            "block_type" ]; // Blacklist restriction type: all/register/api
}

message GetIPRecordsStatsRequest {
  string time_range = 1 [ json_name = "time_range" ]; // today/7days/30days/all
}

message ExportIPListRequest {
  string type = 1; // records/blacklist/monitor
  string time_range = 2
      [ json_name = "time_range" ]; // For monitor type: 1h/6h/24h/7d
}

message GetUsageErrorsRequest {
  PaginationRequest pagination = 1;
  int32 status_code = 2
      [ json_name = "status_code" ]; // Filter by status code (e.g., 400, 500)
  string time_range = 3 [ json_name = "time_range" ]; // today/7days/30days/all
}

message IPRegistrationRecordDTO {
  string ip_address = 1 [ json_name = "ip_address" ];
  string ip_location = 2 [ json_name = "ip_location" ];
  int64 register_count = 3 [ json_name = "register_count" ];
  string last_register_time = 4 [ json_name = "last_register_time" ];
  string status = 5; // normal/blocked
}

message IPBlacklistDTO {
  uint64 id = 1;
  string ip_address = 2 [ json_name = "ip_address" ];
  string ip_location = 3 [ json_name = "ip_location" ];
  string reason = 4;
  string reason_text = 5 [ json_name = "reason_text" ];
  uint64 block_count = 6 [ json_name = "block_count" ];
  string operator_name = 7 [ json_name = "operator_name" ];
  string block_type = 8 [ json_name = "block_type" ];
  string created_at = 9 [ json_name = "created_at" ];
}

message IPDetailDTO {
  string ip_address = 1 [ json_name = "ip_address" ];
  string ip_location = 2 [ json_name = "ip_location" ];
  string status = 3; // normal/blocked
  string first_register_time = 4 [ json_name = "first_register_time" ];
  int64 total_registers = 5 [ json_name = "total_registers" ];
  repeated IPRegistrationAccountDTO accounts = 6;
}

message IPRegistrationAccountDTO {
  string user_id = 1 [ json_name = "user_id" ];
  string email = 2;
  string username = 3;
  string register_time = 4 [ json_name = "register_time" ];
}

message IPRequestMonitorDTO {
  int64 total_requests = 1 [ json_name = "total_requests" ];
  int64 unique_ips = 2 [ json_name = "unique_ips" ];
  int64 rate_limited_count = 3 [ json_name = "rate_limited_count" ];
  int64 abnormal_ips = 4 [ json_name = "abnormal_ips" ];
  repeated IPRequestTopDTO top_ips = 5 [ json_name = "top_ips" ];
  repeated IPAbnormalDTO abnormal_ip_list = 6
      [ json_name = "abnormal_ip_list" ];
  repeated IPRateLimitLogDTO rate_limit_logs = 7
      [ json_name = "rate_limit_logs" ];
}

message IPRequestTopDTO {
  int32 rank = 1;
  string ip_address = 2 [ json_name = "ip_address" ];
  int64 request_count = 3 [ json_name = "request_count" ];
  string status = 4; // normal/high_frequency/abnormal
}

message IPAbnormalDTO {
  string ip_address = 1 [ json_name = "ip_address" ];
  string ip_location = 2 [ json_name = "ip_location" ];
  string abnormal_type = 3
      [ json_name =
            "abnormal_type" ]; // Abnormal request volume/Frequency limit
                               // exceeded/High frequency in short time
  string detected_time = 4 [ json_name = "detected_time" ];
}

message IPRateLimitLogDTO {
  string time = 1;
  string ip_address = 2 [ json_name = "ip_address" ];
  string endpoint = 3;
  string limit_reason = 4 [ json_name = "limit_reason" ];
  int32 current_rate = 5 [ json_name = "current_rate" ];
}

// ========== Email Blacklist Management Messages ==========
message ListEmailBlacklistRequest {
  PaginationRequest pagination = 1;
  string domain = 2; // Search domain
  string status = 3; // active/disabled
}

message AddEmailDomainRequest {
  string domain = 1;
  string status = 2; // active/disabled
  string note = 3;
}

message UpdateEmailDomainRequest {
  uint64 id = 1;
  string status = 2; // active/disabled
  string note = 3;
}

message DeleteEmailDomainRequest { uint64 id = 1; }

message BatchImportEmailDomainsRequest {
  repeated string domains = 1; // Domain list
}

message ToggleEmailDomainStatusRequest { uint64 id = 1; }

message EmailBlacklistDTO {
  uint64 id = 1;
  string domain = 2;
  string status = 3;
  uint64 block_count = 4 [ json_name = "block_count" ];
  string note = 5;
  string created_at = 6 [ json_name = "created_at" ];
  string updated_at = 7 [ json_name = "updated_at" ];
}

message BatchImportEmailDomainsDTO {
  int32 total = 1;
  int32 valid = 2;
  int32 invalid = 3;
  int32 duplicate = 4;
  repeated string invalid_domains = 5 [ json_name = "invalid_domains" ];
  repeated string duplicate_domains = 6 [ json_name = "duplicate_domains" ];
  repeated string new_domains = 7
      [ json_name = "new_domains" ]; // Newly added domains
}

message PreviewImportEmailDomainsRequest {
  repeated string domains = 1; // Domain list
}

message BatchDeleteEmailDomainsRequest {
  repeated uint64 ids = 1; // Domain ID list
}

message BatchDeleteEmailDomainsDTO {
  int64 deleted = 1; // Number of deleted items
}

message BatchAddIPToBlacklistDTO {
  int32 added = 1;   // Number of successfully added items
  int32 skipped = 2; // Number of skipped items (already exists)
  int32 invalid = 3; // Number of invalid IPs
  repeated string invalid_ips = 4
      [ json_name = "invalid_ips" ]; // Invalid IP list
}

message BatchRemoveIPFromBlacklistDTO {
  int64 removed = 1; // Number of removed items
}

message IPRateLimitConfigDTO {
  int32 ip_per_minute = 1
      [ json_name = "ip_per_minute" ]; // Requests per minute limit
  int32 ip_per_hour = 2
      [ json_name = "ip_per_hour" ]; // Requests per hour limit
  string block_type = 3
      [ json_name =
            "block_type" ]; // Blacklist restriction type: all/register/api
}

message IPRecordsStatsDTO {
  int64 total_records = 1 [ json_name = "total_records" ];
  int64 today_new = 2 [ json_name = "today_new" ];
  int64 blocked_count = 3 [ json_name = "blocked_count" ];
  int64 normal_count = 4 [ json_name = "normal_count" ];
}

message IPBlacklistStatsDTO {
  int64 total_count = 1 [ json_name = "total_count" ];
  int64 today_added = 2 [ json_name = "today_added" ];
  int64 total_blocked = 3 [ json_name = "total_blocked" ]; // Total block count
}

message EmailBlacklistStatsDTO {
  int64 total_count = 1 [ json_name = "total_count" ];
  int64 active_count = 2 [ json_name = "active_count" ];
  int64 disabled_count = 3 [ json_name = "disabled_count" ];
}

message UsageErrorDTO {
  string time = 1;
  string ip_address = 2 [ json_name = "ip_address" ];
  string endpoint = 3;
  string method = 4;
  int32 status_code = 5 [ json_name = "status_code" ];
  string error_message = 6 [ json_name = "error_message" ];
  int32 response_time = 7 [ json_name = "response_time" ];
}

// ========== User Token Management Messages ==========
message ListUserTokensRequest {
  string user_id = 1 [ json_name = "user_id" ]; // User ID to query
  PaginationRequest pagination = 2;             // Pagination parameters
}

message GetUserTokenStatsRequest {
  string user_id = 1 [ json_name = "user_id" ]; // User ID to query
}

message UserTokenStatsDTO {
  int32 token_count = 1 [ json_name = "token_count" ]; // Total number of tokens
  int32 active_token_count = 2
      [ json_name = "active_token_count" ]; // Active tokens
  int32 disabled_token_count = 3
      [ json_name = "disabled_token_count" ];               // Disabled tokens
  uint64 monthly_used = 4 [ json_name = "monthly_used" ];   // Monthly usage
  uint64 monthly_limit = 5 [ json_name = "monthly_limit" ]; // Monthly limit
  uint64 total_usage = 6
      [ json_name = "total_usage" ];                // Total historical usage
  string plan_type = 7 [ json_name = "plan_type" ]; // User's plan type
}

// ========== Account Management Messages ==========
message ListAccountsRequest {
  PaginationRequest pagination = 1;
  string search = 2; // Search by username or email (optional)
  string status =
      3; // Filter by status: active/pending/disabled (optional, empty for all)
  string usage_filter = 4 [
    json_name = "usage_filter"
  ]; // Filter by usage: high/medium/low (optional, empty for all)
  // high: >80%, medium: 50-80%, low: <50%
}

message GetAccountDetailRequest {
  string user_id = 1 [ json_name = "user_id" ]; // User ID (required)
}

message ToggleAccountStatusRequest {
  string user_id = 1 [ json_name = "user_id" ]; // User ID (required)
  string action = 2; // Action: enable/disable (required)
}

message ExportAccountsRequest {
  string search = 1; // Search by username or email (optional)
  string status = 2; // Filter by status: active/pending/disabled (optional)
  string usage_filter = 3
      [ json_name =
            "usage_filter" ]; // Filter by usage: high/medium/low (optional)
  string format = 4;          // Export format: csv/excel (default: csv)
}

// APIAccountDTO represents API account information in list
message APIAccountDTO {
  string user_id = 1 [ json_name = "user_id" ]; // User ID
  string username = 2; // Username (from external system, may be empty)
  string email = 3;    // Email (from external system, may be empty)
  int32 token_count = 4 [ json_name = "token_count" ];      // Number of tokens
  uint64 monthly_used = 5 [ json_name = "monthly_used" ];   // Monthly usage
  uint64 monthly_limit = 6 [ json_name = "monthly_limit" ]; // Monthly limit
  double usage_percentage = 7
      [ json_name = "usage_percentage" ];           // Usage percentage (0-100)
  string plan_type = 8 [ json_name = "plan_type" ]; // Plan type: free/paid
  string status = 9; // Account status: active/pending/disabled
  string created_at = 10 [ json_name = "created_at" ]; // Registration time
  string last_active_at = 11
      [ json_name =
            "last_active_at" ]; // Last active time (empty if never active)
}

// APIAccountDetailDTO represents detailed API account information
message APIAccountDetailDTO {
  string user_id = 1 [ json_name = "user_id" ]; // User ID
  string username = 2; // Username (from external system, may be empty)
  string email = 3;    // Email (from external system, may be empty)
  string status = 4;   // Account status: active/pending/disabled
  string plan_type = 5 [ json_name = "plan_type" ];   // Plan type: free/paid
  string created_at = 6 [ json_name = "created_at" ]; // Registration time
  string last_active_at = 7
      [ json_name =
            "last_active_at" ]; // Last active time (empty if never active)
  // Usage statistics (account level)
  uint64 monthly_used = 8 [ json_name = "monthly_used" ];   // Monthly usage
  uint64 monthly_limit = 9 [ json_name = "monthly_limit" ]; // Monthly limit
  uint64 monthly_remaining = 10
      [ json_name = "monthly_remaining" ]; // Monthly remaining
  double usage_percentage = 11
      [ json_name = "usage_percentage" ]; // Usage percentage (0-100)
  uint64 total_usage = 12
      [ json_name = "total_usage" ]; // Total historical usage
  // Token list
  repeated APIAccountTokenDTO tokens = 13; // List of tokens
}

// APIAccountTokenDTO represents token information in API account detail
message APIAccountTokenDTO {
  int64 id = 1 [ json_name = "id" ]; // Token ID
  string name = 2;                   // Token name
  string token_preview = 3
      [ json_name = "token_preview" ]; // Token preview (inj_xxx...xxx)
  string status = 4;                   // Token status: active/disabled
  string created_at = 5 [ json_name = "created_at" ]; // Creation time
  string last_used_at = 6
      [ json_name = "last_used_at" ]; // Last used time (empty if never used)
}

// APIAccountStatsDTO represents API account statistics
message APIAccountStatsDTO {
  int64 total_accounts = 1
      [ json_name = "total_accounts" ]; // Total registered accounts
  int64 active_accounts = 2
      [ json_name = "active_accounts" ];                 // Active accounts
  int64 total_tokens = 3 [ json_name = "total_tokens" ]; // Total tokens
  int64 monthly_active_accounts = 4
      [ json_name = "monthly_active_accounts" ]; // Monthly active accounts
}

// ListAccountsResponse represents paginated account list
message ListAccountsResponse {
  repeated APIAccountDTO accounts = 1;
  PaginationInfo pagination = 2;
}

// ToggleTokenStatusRequest enables or disables a token
message ToggleTokenStatusRequest {
  int64 token_id = 1 [ json_name = "token_id" ]; // Token ID (required)
  string action = 2; // Action: enable/disable (required)
}
