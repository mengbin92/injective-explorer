syntax = "proto3";

package api.explorer.v1;

import "explorer/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "injective-explorer/api/explorer/v1;v1";
option java_multiple_files = true;
option java_package = "api.explorer.v1";

service Demo {
  rpc GetLatestBlocks(PaginationRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/demo/block/latest"
    };
  }
  rpc GetBlockByHeight(GetBlockByHeightRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/demo/block/by-height"
    };
  }
  rpc GetLatestBlockHeight(google.protobuf.Empty) returns (Reply) {
    option (google.api.http) = {
      get : "/demo/block/latest-height"
    };
  }

  rpc GetLatestTransactions(PaginationRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/demo/transaction/latest"
    };
  }
  rpc GetTransactionByHash(GetTransactionByHashRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/demo/transaction/by-hash"
    };
  }

  rpc GetAccountInfo(GetAccountInfoRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/demo/account/info"
    };
  }

  rpc GetAccountTransactions(GetAccountTransactionsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/demo/account/transactions"
    };
  }

  rpc GetAccountBalances(GetAccountBalancesRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/demo/account/balances"
    };
  }

  rpc GetTransactionStats(google.protobuf.Empty) returns (Reply) {
    option (google.api.http) = {
      get : "/demo/transaction/stats"
    };
  }

  // Health check endpoint for gRPC-Web
  rpc CheckHealthy(CheckHealthyRequest) returns (CheckHealthyResponse) {
    option (google.api.http) = {
      get : "/demo/health"
    };
  }

  // Streaming RPCs for real-time updates
  // Stream latest blocks as they are added to the chain
  rpc StreamLatestBlocks(StreamLatestBlocksRequest)
      returns (stream BlockUpdate) {
    option (google.api.http) = {
      get : "/demo/stream/blocks"
    };
  }

  // Stream latest transactions as they are added to the chain
  rpc StreamLatestTransactions(StreamLatestTransactionsRequest)
      returns (stream TransactionUpdate) {
    option (google.api.http) = {
      get : "/demo/stream/transactions"
    };
  }

  // Stream account updates (balance changes, new transactions, etc.)
  rpc StreamAccountUpdates(StreamAccountUpdatesRequest)
      returns (stream AccountUpdate) {
    option (google.api.http) = {
      get : "/demo/stream/account"
    };
  }
}

message GetBlockByHeightRequest { int64 height = 1; }

message GetTransactionByHashRequest { string hash = 1; }

message GetAccountInfoRequest { string address = 1; }

message GetAccountTransactionsRequest {
  string address = 1;
  PaginationRequest pagination = 2;
}

message GetAccountBalancesRequest { string address = 1; }

// Health check messages
message CheckHealthyRequest {
  // Optional: service name to check
  string service = 1;
}

// HealthDetails contains detailed health information for each component
message HealthDetails {
  // Component status: "healthy", "unhealthy", "unavailable", "not_configured"
  string status = 1;
  // Optional error message if component is unhealthy
  string error = 2;
  // Optional latency in milliseconds
  double latency_ms = 3;
}

// CheckHealthyResponse contains the health status of the service
message CheckHealthyResponse {
  // Health status: "healthy", "degraded", "unhealthy"
  string status = 1;
  // Service name
  string service = 2;
  // Timestamp of the health check
  int64 timestamp = 3;
  // Health details for each component (database, redis, etc.)
  map<string, HealthDetails> details = 4;
}

// Streaming request messages
message StreamLatestBlocksRequest {
  // Optional: start streaming from a specific block height
  // If 0, streams from the latest blocks
  int64 from_height = 1;
}

message StreamLatestTransactionsRequest {
  // Optional: filter by transaction types
  // If empty, streams all transaction types
  repeated string types = 1;
}

message StreamAccountUpdatesRequest {
  // Required: account address to monitor
  string address = 1;
  // Optional: start streaming from a specific timestamp
  // If 0, streams from recent transactions
  int64 from_timestamp = 2;
}

// Streaming response messages
message BlockUpdate {
  // Block data using strongly-typed BlockDTO
  BlockDTO block = 1;
  // Update type: "new" or "update"
  string update_type = 2 [ json_name = "update_type" ];
  // Timestamp of the update
  int64 timestamp = 3;
}

message TransactionUpdate {
  // Transaction data using strongly-typed TransactionDTO
  TransactionDTO transaction = 1;
  // Update type: "new" or "update"
  string update_type = 2 [ json_name = "update_type" ];
  // Timestamp of the update
  int64 timestamp = 3;
}

// AccountUpdateData contains account update information
message AccountUpdateData {
  // Transaction data if update_type is "transaction"
  TransactionDTO transaction = 1;
  // Balance data if update_type is "balance"
  repeated AccountBalanceDTO balances = 2;
  // Additional metadata
  map<string, string> metadata = 3;
}

message AccountUpdate {
  // Account address
  string address = 1;
  // Update type: "transaction", "balance", etc.
  string update_type = 2 [ json_name = "update_type" ];
  // Update data using strongly-typed AccountUpdateData
  AccountUpdateData data = 3;
  // Timestamp of the update
  int64 timestamp = 4;
}

message LatestBlockHeightResponse { int64 height = 1; }

// TransactionStatsResponse contains transaction volume statistics
message TransactionStatsResponse {
  // Total transaction count (all time)
  int64 total_count = 1 [ json_name = "total_count" ];
  // Transaction count in the last 30 days
  int64 count_30d = 2 [ json_name = "count_30d" ];
  // Transaction count in the last 24 hours
  int64 count_24h = 3 [ json_name = "count_24h" ];
  // Average TPS (Transactions Per Second) calculated from the latest 100 blocks
  // TPS = total transactions / time span in seconds
  double tps = 4;
  // Number of unique active addresses in the last 24 hours
  int64 active_addresses_24h = 5 [ json_name = "active_addresses_24h" ];
  // Current average gas price from the latest 10 blocks
  double avg_gas_price = 6 [ json_name = "avg_gas_price" ];
  // Average block time in seconds from the latest 100 blocks
  double avg_block_time = 7 [ json_name = "avg_block_time" ];
  // Current gas price (average from latest 10 blocks)
  double current_gas_price = 8 [ json_name = "current_gas_price" ];
  // Maximum gas price in the last 24 hours
  double max_gas_price_24h = 9 [ json_name = "max_gas_price_24h" ];
  // Minimum gas price in the last 24 hours
  double min_gas_price_24h = 10 [ json_name = "min_gas_price_24h" ];
  // Number of failed transactions in the last 24 hours
  int64 failed_tx_count_24h = 11 [ json_name = "failed_tx_count_24h" ];
  // Gas utilization rate from the latest 10 blocks (percentage)
  // Gas utilization = (Σgas_used / Σgas_wanted) × 100%
  double gas_utilization = 12 [ json_name = "gas_utilization" ];
}

message AccountDTO {
  string address = 1;
  string base_account = 2;
  string code_hash = 3;
}

message AccountBalanceDTO {
  string address = 1;
  string denom = 2;
  string amount = 3;
}

message BlockDTO {
  uint64 height = 1;
  string proposer = 2;
  string moniker = 3;
  string block_hash = 4 [ json_name = "block_hash" ];
  string parent_hash = 5 [ json_name = "parent_hash" ];
  int64 num_precommits = 6 [ json_name = "num_precommits" ];
  int64 num_txs = 7 [ json_name = "num_txs" ];
  int64 total_txs = 8 [ json_name = "total_txs" ];
  repeated string txs = 9;
  string timestamp = 10;
  uint64 block_unix_timestamp = 11 [ json_name = "block_unix_timestamp" ];
}

message TransactionDTO {
  string id = 1;
  uint64 block_number = 2 [ json_name = "block_number" ];
  string block_timestamp = 3 [ json_name = "block_timestamp" ];
  string hash = 4;
  uint32 code = 5;
  string data = 6;
  string info = 7;
  int64 gas_wanted = 8 [ json_name = "gas_wanted" ];
  int64 gas_used = 9 [ json_name = "gas_used" ];
  string gas_fee = 10 [ json_name = "gas_fee" ];
  string codespace = 11;
  repeated string events = 12;
  string tx_type = 13 [ json_name = "tx_type" ];
  string messages = 14;
  repeated string signatures = 15;
  string memo = 16;
  uint64 tx_number = 17 [ json_name = "tx_number" ];
  uint64 block_unix_timestamp = 18 [ json_name = "block_unix_timestamp" ];
  string error_log = 19 [ json_name = "error_log" ];
  string logs = 20;
  repeated int64 claim_ids = 21 [ json_name = "claim_ids" ];
  string signer =
      22; // Transaction initiator (first signer), may differ from fee payer
  string to = 23;    // Recipient address (corresponds to 'to' field in ethereum
                     // tx, or recipient in other tx types)
  string value = 24; // Transaction value (corresponds to 'value' field in
                     // ethereum tx, or amount in other tx types)
}