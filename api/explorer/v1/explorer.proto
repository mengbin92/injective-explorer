syntax = "proto3";

package api.explorer.v1;

import "explorer/v1/common.proto";
import "explorer/v1/wasm.proto";
import "explorer/v1/validator.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "injective-explorer/api/explorer/v1;v1";
option java_multiple_files = true;
option java_package = "api.explorer.v1";

service Explorer {
  rpc GetLatestBlocks(PaginationRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/block/latest"
    };
  }
  rpc GetBlockByHeight(GetBlockByHeightRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/block/by-height"
    };
  }
  rpc GetLatestBlockHeight(google.protobuf.Empty) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/block/latest-height"
    };
  }

  rpc GetLatestTransactions(PaginationRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/transaction/latest"
    };
  }
  rpc GetTransactionByHash(GetTransactionByHashRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/transaction/by-hash"
    };
  }
  rpc GetBlockTransactions(GetBlockTransactionsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/block/transactions"
    };
  }

  // Batch query interfaces for better performance
  rpc GetTransactionsBatch(GetTransactionsBatchRequest) returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/transactions/batch"
      body : "*"
    };
  }

  rpc GetBlocksBatch(GetBlocksBatchRequest) returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/blocks/batch"
      body : "*"
    };
  }

  rpc GetAccountInfo(GetAccountInfoRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/account/info"
    };
  }

  rpc GetAccountTransactions(GetAccountTransactionsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/account/transactions"
    };
  }

  rpc GetAccountBalances(GetAccountBalancesRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/account/balances"
    };
  }

  rpc GetTransactionStats(google.protobuf.Empty) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/transaction/stats"
    };
  }

  // Get block gas utilization for the latest 10 blocks
  rpc GetBlockGasUtilization(google.protobuf.Empty) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/block/gas-utilization"
    };
  }

  // Get failed transactions in the last 24 hours with failure reasons
  rpc GetFailedTransactions24h(GetFailedTransactions24hRequest)
      returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/transaction/failed-24h"
    };
  }

  // Get failure statistics for the latest 1000 transactions
  rpc GetFailedTransactions1000(google.protobuf.Empty) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/transaction/failed-1000"
    };
  }

  // EVM transaction related APIs
  // Get EVM transaction by hash
  rpc GetEVMTransaction(GetEVMTransactionRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/evm/transaction"
    };
  }

  // Get EVM transactions list
  rpc GetEVMTransactions(GetEVMTransactionsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/evm/transactions"
    };
  }

  // Get EVM account transactions
  rpc GetEVMAccountTransactions(GetEVMAccountTransactionsRequest)
      returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/evm/account/transactions"
    };
  }

  // Health check endpoint for gRPC-Web
  rpc CheckHealthy(CheckHealthyRequest) returns (CheckHealthyResponse) {
    option (google.api.http) = {
      get : "/api/v1/health"
    };
  }

  // Streaming RPCs for real-time updates
  // Stream latest blocks as they are added to the chain
  rpc StreamLatestBlocks(StreamLatestBlocksRequest)
      returns (stream BlockUpdate) {
    option (google.api.http) = {
      get : "/api/v1/stream/blocks"
    };
  }

  // Stream latest transactions as they are added to the chain
  rpc StreamLatestTransactions(StreamLatestTransactionsRequest)
      returns (stream TransactionUpdate) {
    option (google.api.http) = {
      get : "/api/v1/stream/transactions"
    };
  }

  // Stream account updates (balance changes, new transactions, etc.)
  rpc StreamAccountUpdates(StreamAccountUpdatesRequest)
      returns (stream AccountUpdate) {
    option (google.api.http) = {
      get : "/api/v1/stream/account"
    };
  }

  // Get token price and market cap (supports multiple tokens)
  // If token symbol is not specified, uses the default token from configuration
  rpc GetTokenPriceAndMarketCap(GetTokenPriceAndMarketCapRequest)
      returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/token/price-marketcap"
    };
  }

  // Get validator block statistics (proposed, signed, missed blocks)
  rpc GetValidatorBlockStats(GetValidatorBlockStatsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/validator/block-stats"
    };
  }

  // GetAllContractTags retrieves all contract tags (supports filtering and
  // pagination)
  rpc GetAllContractTags(GetAllContractTagsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/contract/tags/all"
    };
  }

  // AddGlobalTag adds a global tag (not bound to a specific contract)
  rpc AddGlobalTag(AddGlobalTagRequest) returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/global/tag"
      body : "*"
    };
  }

  // RemoveGlobalTag removes a global tag
  rpc RemoveGlobalTag(RemoveGlobalTagRequest) returns (Reply) {
    option (google.api.http) = {
      delete : "/api/v1/global/tag"
    };
  }

  // Cross-chain transaction query interfaces
  // Get IBC transfer transactions
  rpc GetIBCTransferTxs(GetIBCTransferTxsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/ibc/transfers"
    };
  }

  // Get Peggy deposit transactions (Ethereum -> Injective)
  rpc GetPeggyDepositTxs(GetPeggyDepositTxsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/peggy/deposits"
    };
  }

  // Get Peggy withdrawal transactions (Injective -> Ethereum)
  rpc GetPeggyWithdrawalTxs(GetPeggyWithdrawalTxsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/peggy/withdrawals"
    };
  }

  // Wasm Contract APIs

  // Get list of Wasm contracts with filtering and pagination
  rpc GetWasmContracts(GetWasmContractsRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/wasm/contracts"
    };
  }

  // Get Wasm contract details by address
  rpc GetWasmContractByAddress(GetWasmContractByAddressRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/wasm/contract/info"
    };
  }

  // Get CW20 token balances for an address
  rpc GetCW20Balance(GetCW20BalanceRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/wasm/cw20/balance"
    };
  }

  // Get contract execution transactions
  rpc GetContractTxs(GetContractTxsRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/wasm/contract/transactions"
    };
  }

  // Get list of uploaded Wasm codes
  rpc GetWasmCodes(GetWasmCodesRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/wasm/codes"
    };
  }

  // Get Wasm code details by ID
  rpc GetWasmCodeByID(GetWasmCodeByIDRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/wasm/code/info"
    };
  }

  // Validator APIs

  // Get list of validators with filtering and sorting
  rpc GetValidators(GetValidatorsRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/validators"
    };
  }

  // Get detailed validator information
  rpc GetValidator(GetValidatorRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/validator/info"
    };
  }

  // Get validator uptime statistics
  rpc GetValidatorUptime(GetValidatorUptimeRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/validator/uptime"
    };
  }
}

message GetBlockByHeightRequest { int64 height = 1; }

message GetBlockTransactionsRequest {
  int64 height = 1;                 // Block height
  PaginationRequest pagination = 2; // Optional pagination
}

message GetTransactionByHashRequest { string hash = 1; }

// Batch query request messages
message GetTransactionsBatchRequest {
  repeated string hashes = 1; // Transaction hash list
}

message GetBlocksBatchRequest {
  repeated uint64 heights = 1; // Block height list
}

message GetAccountInfoRequest { string address = 1; }

message GetAccountTransactionsRequest {
  string address = 1;
  PaginationRequest pagination = 2;
  // Optional: filter by message types from transaction messages (e.g.,
  // ["/cosmos.bank.v1beta1.MsgSend", "/injective.exchange.v1beta1.MsgDeposit",
  // "MsgWithdraw"]) Supports both full type URL (e.g.,
  // "/cosmos.bank.v1beta1.MsgSend") and short type name (e.g., "MsgSend") If
  // empty, returns all transactions regardless of message types Note: A
  // transaction matches if ANY of its messages matches ANY of the specified
  // types
  repeated string tx_types = 3 [ json_name = "tx_types" ];
}

message GetAccountBalancesRequest { string address = 1; }

// GetTokenPriceAndMarketCapRequest requests token price and market cap
message GetTokenPriceAndMarketCapRequest {
  // Token symbol (e.g., "inj", "mycoin"). If not specified, uses default token
  // from configuration
  string token_symbol = 1 [ json_name = "token_symbol" ];
}

// GetValidatorBlockStatsRequest requests validator block statistics
message GetValidatorBlockStatsRequest {
  // Validator operator address (required)
  string validator_address = 1 [ json_name = "validator_address" ];
}

// ValidatorBlockStatsResponse contains validator block statistics
message ValidatorBlockStatsResponse {
  // Validator operator address
  string validator_address = 1 [ json_name = "validator_address" ];
  // Validator moniker
  string moniker = 2;
  // Number of blocks proposed
  uint64 proposed = 3;
  // Number of blocks signed
  uint64 signed = 4;
  // Number of blocks missed
  uint64 missed = 5;
  // Uptime percentage (calculated from signed/missed)
  double uptime_percentage = 6 [ json_name = "uptime_percentage" ];
}

// GetAllContractTagsRequest requests all contract tags with optional filters
message GetAllContractTagsRequest {
  // Chain ID filter (optional)
  string chain_id = 1 [ json_name = "chain_id" ];
  // Tag type filter (optional)
  string tag_type = 2 [ json_name = "tag_type" ];
  // Contract address filter (optional)
  string contract_address = 3 [ json_name = "contract_address" ];
  // Pagination parameters
  PaginationRequest pagination = 4;
}

// AddGlobalTagRequest requests adding a global tag
message AddGlobalTagRequest {
  string chain_id = 1 [ json_name = "chain_id" ];   // Chain ID (required)
  string tag_type = 2 [ json_name = "tag_type" ];   // Tag type (required)
  string tag_value = 3 [ json_name = "tag_value" ]; // Tag value (optional)
  string tag_color = 4 [ json_name = "tag_color" ]; // Tag color (optional)
  string description = 5; // Tag description (optional)
  string created_by = 6 [ json_name = "created_by" ]; // Creator (optional)
}

// RemoveGlobalTagRequest requests removing a global tag
message RemoveGlobalTagRequest {
  string chain_id = 1 [ json_name = "chain_id" ]; // Chain ID (required)
  string tag_type = 2 [ json_name = "tag_type" ]; // Tag type (required)
}

// GlobalTagInfoDTO represents global tag information in the response
message GlobalTagInfoDTO {
  uint64 id = 1;
  string chain_id = 2 [ json_name = "chain_id" ];
  string tag_type = 3 [ json_name = "tag_type" ];
  string tag_value = 4 [ json_name = "tag_value" ];
  string tag_color = 5 [ json_name = "tag_color" ];
  string description = 6;
  string created_by = 7 [ json_name = "created_by" ];
  string created_at = 8 [ json_name = "created_at" ];
}

// GetFailedTransactions24hRequest requests failed transactions in the last 24
// hours
message GetFailedTransactions24hRequest { PaginationRequest pagination = 1; }

// FailedTransactions1000Response contains failed transactions in the latest
// 1000 transactions
message FailedTransactions1000Response {
  repeated FailedTransactionInfo transactions =
      1;                         // List of failed transactions
  PaginationInfo pagination = 2; // Pagination information
  double success_rate_1000 = 3 [
    json_name = "success_rate_1000"
  ]; // Overall success rate in the latest 1000 transactions (percentage, 0-100)
}

// EVM transaction related requests and responses
message GetEVMTransactionRequest {
  string hash = 1; // Transaction hash
}

message GetEVMTransactionsRequest {
  int32 page = 1; // Page number (default: 1)
  int32 page_size = 2
      [ json_name = "page_size" ]; // Page size (default: 20, max: 100)
  string cursor = 3;               // Cursor for cursor-based pagination
}

message GetEVMAccountTransactionsRequest {
  string address = 1; // Account address (supports 0x and inj1 format)
  int32 page = 2;     // Page number (default: 1)
  int32 page_size = 3
      [ json_name = "page_size" ]; // Page size (default: 20, max: 100)
  string cursor = 4;               // Cursor for cursor-based pagination
}

// GasFeeCoin represents a single coin in the gas fee
message GasFeeCoin {
  string denom = 1;  // Denomination (e.g., "inj")
  string amount = 2; // Amount as string (e.g., "1000000")
}

// GasFee represents structured gas fee information
message GasFee {
  repeated GasFeeCoin amount = 1; // List of coins paid as gas fee
  int64 gas_limit = 2 [ json_name = "gas_limit" ]; // Gas limit
  string payer = 3; // Fee payer address (optional)
}

// FailedTransactionInfo contains information about a failed transaction
message FailedTransactionInfo {
  string hash = 1;                                        // Transaction hash
  uint64 block_number = 2 [ json_name = "block_number" ]; // Block number
  uint64 block_unix_timestamp = 3
      [ json_name = "block_unix_timestamp" ]; // Block timestamp
  uint32 code = 4;      // Error code (non-zero for failed transactions)
  string codespace = 5; // Error codespace
  string error_log = 6
      [ json_name =
            "error_log" ]; // Error log message (sanitized and truncated)
  string signer = 7;       // Transaction signer
  int64 gas_used = 8 [ json_name = "gas_used" ];     // Gas used
  int64 gas_wanted = 9 [ json_name = "gas_wanted" ]; // Gas wanted
  GasFee gas_fee = 10
      [ json_name = "gas_fee" ]; // Structured gas fee information
  string tx_type = 11 [ json_name = "tx_type" ]; // Transaction type
}

// FailedTransactions24hResponse contains failed transactions in the last 24
// hours
message FailedTransactions24hResponse {
  repeated FailedTransactionInfo transactions =
      1;                         // List of failed transactions
  PaginationInfo pagination = 2; // Pagination information
  double success_rate_24h = 3 [
    json_name = "success_rate_24h"
  ]; // Overall success rate in the last 24 hours (percentage, 0-100)
}

// Health check messages
message CheckHealthyRequest {
  // Optional: service name to check
  string service = 1;
}

// HealthDetails contains detailed health information for each component
message HealthDetails {
  // Component status: "healthy", "unhealthy", "unavailable", "not_configured"
  string status = 1;
  // Optional error message if component is unhealthy
  string error = 2;
  // Optional latency in milliseconds
  double latency_ms = 3;
}

// CheckHealthyResponse contains the health status of the service
message CheckHealthyResponse {
  // Health status: "healthy", "degraded", "unhealthy"
  string status = 1;
  // Service name
  string service = 2;
  // Timestamp of the health check
  int64 timestamp = 3;
  // Health details for each component (database, redis, etc.)
  map<string, HealthDetails> details = 4;
}

// Streaming request messages
message StreamLatestBlocksRequest {
  // Optional: start streaming from a specific block height
  // If 0, streams from the latest blocks
  int64 from_height = 1;
}

message StreamLatestTransactionsRequest {
  // Optional: filter by transaction types
  // If empty, streams all transaction types
  repeated string types = 1;
}

message StreamAccountUpdatesRequest {
  // Required: account address to monitor
  string address = 1;
  // Optional: start streaming from a specific timestamp
  // If 0, streams from recent transactions
  int64 from_timestamp = 2;
}

// Streaming response messages
message BlockUpdate {
  // Block data using strongly-typed BlockDTO
  BlockDTO block = 1;
  // Update type: "new" or "update"
  string update_type = 2 [ json_name = "update_type" ];
  // Timestamp of the update
  int64 timestamp = 3;
}

message TransactionUpdate {
  // Transaction data using strongly-typed TransactionDTO
  TransactionDTO transaction = 1;
  // Update type: "new" or "update"
  string update_type = 2 [ json_name = "update_type" ];
  // Timestamp of the update
  int64 timestamp = 3;
}

// AccountUpdateData contains account update information
message AccountUpdateData {
  // Transaction data if update_type is "transaction"
  TransactionDTO transaction = 1;
  // Balance data if update_type is "balance"
  repeated AccountBalanceDTO balances = 2;
  // Additional metadata
  map<string, string> metadata = 3;
}

message AccountUpdate {
  // Account address
  string address = 1;
  // Update type: "transaction", "balance", etc.
  string update_type = 2 [ json_name = "update_type" ];
  // Update data using strongly-typed AccountUpdateData
  AccountUpdateData data = 3;
  // Timestamp of the update
  int64 timestamp = 4;
}

message LatestBlockHeightResponse { int64 height = 1; }

// BlockGasUtilizationResponse contains gas utilization statistics for the
// latest 10 blocks
message BlockGasUtilizationResponse {
  // Gas utilization rate (percentage)
  // Gas utilization = (Σgas_used / Σmax_gas) × 100%
  double gas_utilization = 1 [ json_name = "gas_utilization" ];
  // Total gas used across all transactions in the latest 10 blocks
  int64 total_gas_used = 2 [ json_name = "total_gas_used" ];
  // Total gas limit (10 blocks × max_gas per block)
  int64 total_gas_limit = 3 [ json_name = "total_gas_limit" ];
  // Number of blocks analyzed
  int32 block_count = 4 [ json_name = "block_count" ];
  // Total number of transactions in the analyzed blocks
  int64 transaction_count = 5 [ json_name = "transaction_count" ];
  // Max gas per block (gas limit)
  int64 block_gas_limit = 6 [ json_name = "block_gas_limit" ];
  // Current gas price (in inj or smallest denomination)
  string gas_price = 7 [ json_name = "gas_price" ];
}

// TransactionStatsResponse contains transaction volume statistics
message TransactionStatsResponse {
  // Total transaction count (all time)
  int64 total_count = 1 [ json_name = "total_count" ];
  // Transaction count in the last 30 days
  int64 count_30d = 2 [ json_name = "count_30d" ];
  // Transaction count in the last 24 hours
  int64 count_24h = 3 [ json_name = "count_24h" ];
  // Average TPS (Transactions Per Second) calculated from the latest 100 blocks
  // TPS = total transactions / time span in seconds
  double tps = 4;
  // Number of unique active addresses in the last 24 hours
  int64 active_addresses_24h = 5 [ json_name = "active_addresses_24h" ];
  // Current average gas price from the latest 10 blocks
  double avg_gas = 6 [ json_name = "avg_gas" ];
  // Average block time in seconds from the latest 100 blocks
  double avg_block_time = 7 [ json_name = "avg_block_time" ];
  // Current gas price (average from latest 10 blocks)
  double current_gas = 8 [ json_name = "current_gas" ];
  // Maximum gas price in the last 24 hours
  double max_gas_24h = 9 [ json_name = "max_gas_24h" ];
  // Minimum gas price in the last 24 hours
  double min_gas_24h = 10 [ json_name = "min_gas_24h" ];
  // Number of failed transactions in the last 24 hours
  int64 failed_tx_count_24h = 11 [ json_name = "failed_tx_count_24h" ];
  // Gas utilization rate from the latest 10 blocks (percentage)
  // Gas utilization = (Σgas_used / Σgas_wanted) × 100%
  double gas_utilization = 12 [ json_name = "gas_utilization" ];
}

message AccountDTO {
  string address = 1;
  string base_account = 2;
  string code_hash = 3;
}

message AccountBalanceDTO {
  string address = 1;
  string denom = 2;
  string amount = 3;
}

message BlockDTO {
  uint64 height = 1;
  string proposer = 2;
  string moniker = 3;
  string block_hash = 4 [ json_name = "block_hash" ];
  string parent_hash = 5 [ json_name = "parent_hash" ];
  int64 num_precommits = 6 [ json_name = "num_precommits" ];
  int64 num_txs = 7 [ json_name = "num_txs" ];
  int64 total_txs = 8 [ json_name = "total_txs" ];
  repeated string txs = 9; // Transaction data as hash list
  string timestamp = 10;
  uint64 block_unix_timestamp = 11 [ json_name = "block_unix_timestamp" ];
}

// TransactionSignature represents a transaction signature with address
// information
message TransactionSignature {
  string pubkey = 1;    // Public key (base64 encoded)
  string address = 2;   // Signer address (Ethereum format 0x...)
  uint64 sequence = 3;  // Account sequence number
  string signature = 4; // Signature data (base64 encoded)
}

message TransactionDTO {
  string id = 1;
  uint64 block_number = 2 [ json_name = "block_number" ];
  string block_timestamp = 3 [ json_name = "block_timestamp" ];
  string hash = 4;
  uint32 code = 5;
  string data = 6;
  string info = 7;
  int64 gas_wanted = 8 [ json_name = "gas_wanted" ];
  int64 gas_used = 9 [ json_name = "gas_used" ];
  string gas_fee = 10 [ json_name = "gas_fee" ];
  string codespace = 11;
  repeated string events = 12;
  string tx_type = 13 [ json_name = "tx_type" ];
  google.protobuf.ListValue messages = 14;  // Array of message objects
  repeated TransactionSignature signatures = 15;
  string memo = 16;
  uint64 tx_number = 17 [ json_name = "tx_number" ];
  uint64 block_unix_timestamp = 18 [ json_name = "block_unix_timestamp" ];
  string error_log = 19 [ json_name = "error_log" ];
  string logs = 20;
  repeated int64 claim_ids = 21 [ json_name = "claim_ids" ];
  string signer =
      22; // Transaction initiator (first signer), may differ from fee payer
  string to = 23;    // Recipient address (corresponds to 'to' field in ethereum
                     // tx, or recipient in other tx types)
  string value = 24; // Transaction value
  EVMTransactionDTO evm_transaction = 25 [
    json_name = "evm_transaction"
  ]; // EVM transaction details (only present for EVM transactions)
  repeated TokenTransferDTO token_transfers = 26
      [ json_name =
            "token_transfers" ]; // ERC20/ERC721 token transfers (only present
                                 // for EVM transactions with token transfers)
}

// EVMTransactionDTO represents an EVM transaction in Etherscan-like format
message EVMTransactionDTO {
  string hash = 1;                                        // Transaction hash
  uint64 block_number = 2 [ json_name = "block_number" ]; // Block number
  string block_timestamp = 3
      [ json_name = "block_timestamp" ]; // Block timestamp
  string from = 4;                       // Sender address
  string to = 5;    // Recipient address (empty for contract creation)
  string value = 6; // Transaction value in wei
  uint64 nonce = 7; // Transaction nonce
  string gas_price = 8 [ json_name = "gas_price" ];    // Gas price in wei
  uint64 gas_limit = 9 [ json_name = "gas_limit" ];    // Gas limit
  uint64 gas_used = 10 [ json_name = "gas_used" ];     // Gas used
  string input_data = 11 [ json_name = "input_data" ]; // Input data (hex)
  string contract_address = 12
      [ json_name =
            "contract_address" ]; // Contract address (for contract creation)
  string method_id = 13
      [ json_name = "method_id" ]; // Method ID (first 4 bytes)
  string method_name = 14
      [ json_name =
            "method_name" ];    // Method name (resolved via 4byte.directory)
  string status = 15;           // Execution status: "success" or "fail"
  repeated EVMLogDTO logs = 16; // Event logs
  string transaction_fee = 17
      [ json_name =
            "transaction_fee" ]; // Transaction fee (gas_used * gas_price)
  bool is_contract_call = 18
      [ json_name = "is_contract_call" ]; // Whether this is a contract call
  bool is_contract_create = 19
      [ json_name =
            "is_contract_create" ]; // Whether this is a contract creation
}

// EVMLogDTO represents an EVM event log
message EVMLogDTO {
  string address = 1;         // Contract address that emitted the log
  repeated string topics = 2; // Log topics (indexed parameters)
  string data = 3;            // Log data (non-indexed parameters, hex)
  uint64 block_number = 4 [ json_name = "block_number" ]; // Block number
  string tx_hash = 5 [ json_name = "tx_hash" ];           // Transaction hash
  uint32 tx_index = 6 [ json_name = "tx_index" ]; // Transaction index in block
  uint32 log_index = 7 [ json_name = "log_index" ]; // Log index in transaction
}

// TokenTransferDTO represents an ERC20/ERC721 token transfer
message TokenTransferDTO {
  string contract_address = 1
      [ json_name = "contract_address" ]; // Token contract address
  string from_address = 2 [ json_name = "from_address" ]; // Sender address
  string to_address = 3 [ json_name = "to_address" ];     // Receiver address
  string amount = 4; // Transfer amount (raw units)
  string token_symbol = 5
      [ json_name =
            "token_symbol" ]; // Token symbol (optional, from contract_info)
  string token_name = 6 [ json_name = "token_name" ]; // Token name (optional)
  int32 decimals = 7; // Token decimals (optional, default 18)
  string method = 8;  // Transfer type: Transfer, Mint, Burn
}

// TokenPriceAndMarketCapResponse contains token price and market cap
// information
message TokenPriceAndMarketCapResponse {
  // Token symbol (e.g., "inj", "mycoin")
  string token_symbol = 1 [ json_name = "token_symbol" ];
  // Token display name (e.g., "Injective", "My Token")
  string token_name = 2 [ json_name = "token_name" ];
  // Current price in USD
  double price_usd = 3 [ json_name = "price_usd" ];
  // Total supply of tokens (in base units, e.g., 1 token = 10^decimals base
  // units)
  string total_supply = 4 [ json_name = "total_supply" ];
  // Total supply in human-readable format (tokens)
  string total_supply_formatted = 5 [ json_name = "total_supply_formatted" ];
  // Market cap in USD (price * total_supply)
  double market_cap_usd = 6 [ json_name = "market_cap_usd" ];
  // Price change percentage in the last 24 hours
  double price_change_24h = 7 [ json_name = "price_change_24h" ];
  // Last updated timestamp (Unix timestamp in seconds)
  int64 last_updated = 8 [ json_name = "last_updated" ];
  // Price source (e.g., "coingecko", "custom")
  string price_source = 9 [ json_name = "price_source" ];
  // Supply source (e.g., "coingecko", "chain")
  // "coingecko" means total supply after accounting for burned tokens
  // "chain" means on-chain supply (before accounting for burned tokens)
  string supply_source = 10 [ json_name = "supply_source" ];
  // On-chain supply (before burn) for reference, in base units
  string total_supply_from_chain = 11 [ json_name = "total_supply_from_chain" ];
  // On-chain supply (before burn) in human-readable format
  string total_supply_from_chain_formatted = 12
      [ json_name = "total_supply_from_chain_formatted" ];
}

// Cross-chain transaction request messages
// GetIBCTransferTxsRequest requests IBC transfer transactions
message GetIBCTransferTxsRequest {
  // Sender address (optional filter)
  string sender = 1;
  // Receiver address (optional filter)
  string receiver = 2;
  // Source channel (optional filter)
  string src_channel = 3 [ json_name = "src_channel" ];
  // Source port (optional filter)
  string src_port = 4 [ json_name = "src_port" ];
  // Destination channel (optional filter)
  string dest_channel = 5 [ json_name = "dest_channel" ];
  // Destination port (optional filter)
  string dest_port = 6 [ json_name = "dest_port" ];
  // Pagination parameters
  PaginationRequest pagination = 7;
}

// GetPeggyDepositTxsRequest requests Peggy deposit transactions
message GetPeggyDepositTxsRequest {
  // Sender address (Ethereum address, optional filter)
  string sender = 1;
  // Receiver address (Injective address, optional filter)
  string receiver = 2;
  // Pagination parameters
  PaginationRequest pagination = 3;
}

// GetPeggyWithdrawalTxsRequest requests Peggy withdrawal transactions
message GetPeggyWithdrawalTxsRequest {
  // Sender address (Injective address, optional filter)
  string sender = 1;
  // Receiver address (Ethereum address, optional filter)
  string receiver = 2;
  // Pagination parameters
  PaginationRequest pagination = 3;
}

// Cross-chain transaction DTOs
// IBCTransferTxDTO represents IBC transfer transaction in API response
message IBCTransferTxDTO {
  // Sender address
  string sender = 1;
  // Receiver address
  string receiver = 2;
  // Source port
  string source_port = 3 [ json_name = "source_port" ];
  // Source channel
  string source_channel = 4 [ json_name = "source_channel" ];
  // Destination port
  string destination_port = 5 [ json_name = "destination_port" ];
  // Destination channel
  string destination_channel = 6 [ json_name = "destination_channel" ];
  // Transfer amount
  string amount = 7;
  // Token denomination
  string denom = 8;
  // Timeout height
  string timeout_height = 9 [ json_name = "timeout_height" ];
  // Timeout timestamp (nanoseconds)
  uint64 timeout_timestamp = 10 [ json_name = "timeout_timestamp" ];
  // Packet sequence number
  uint64 packet_sequence = 11 [ json_name = "packet_sequence" ];
  // Data in hex format
  bytes data_hex = 12 [ json_name = "data_hex" ];
  // Transaction state (pending, completed, failed, timeout)
  string state = 13;
  // Transaction hashes (array for compatibility)
  repeated string tx_hashes = 14 [ json_name = "tx_hashes" ];
  // Creation timestamp (ISO 8601 format)
  string created_at = 15 [ json_name = "created_at" ];
  // Last update timestamp (ISO 8601 format)
  string updated_at = 16 [ json_name = "updated_at" ];
}

// PeggyDepositTxDTO represents Peggy deposit transaction in API response
message PeggyDepositTxDTO {
  // Sender address (Ethereum address)
  string sender = 1;
  // Receiver address (Injective address)
  string receiver = 2;
  // Event nonce
  uint64 event_nonce = 3 [ json_name = "event_nonce" ];
  // Event height
  uint64 event_height = 4 [ json_name = "event_height" ];
  // Deposit amount
  string amount = 5;
  // Token denomination
  string denom = 6;
  // Orchestrator address
  string orchestrator_address = 7 [ json_name = "orchestrator_address" ];
  // Transaction state (pending, completed, failed)
  string state = 8;
  // Claim type (1 for DepositClaim)
  int32 claim_type = 9 [ json_name = "claim_type" ];
  // Transaction hashes
  repeated string tx_hashes = 10 [ json_name = "tx_hashes" ];
  // Creation timestamp (ISO 8601 format)
  string created_at = 11 [ json_name = "created_at" ];
  // Last update timestamp (ISO 8601 format)
  string updated_at = 12 [ json_name = "updated_at" ];
  // Ethereum transaction hash (for the original ETH chain transaction)
  string eth_tx_hash = 13 [ json_name = "eth_tx_hash" ];
}

// PeggyWithdrawalTxDTO represents Peggy withdrawal transaction in API response
message PeggyWithdrawalTxDTO {
  // Sender address (Injective address)
  string sender = 1;
  // Receiver address (Ethereum address)
  string receiver = 2;
  // Withdrawal amount
  string amount = 3;
  // Token denomination
  string denom = 4;
  // Bridge fee
  string bridge_fee = 5 [ json_name = "bridge_fee" ];
  // Outgoing transaction ID
  uint64 outgoing_tx_id = 6 [ json_name = "outgoing_tx_id" ];
  // Batch timeout timestamp
  uint64 batch_timeout = 7 [ json_name = "batch_timeout" ];
  // Batch nonce
  uint64 batch_nonce = 8 [ json_name = "batch_nonce" ];
  // Orchestrator address
  string orchestrator_address = 9 [ json_name = "orchestrator_address" ];
  // Event nonce
  uint64 event_nonce = 10 [ json_name = "event_nonce" ];
  // Event height
  uint64 event_height = 11 [ json_name = "event_height" ];
  // Transaction state (pending, batched, completed, failed)
  string state = 12;
  // Claim type (2 for WithdrawalClaim)
  int32 claim_type = 13 [ json_name = "claim_type" ];
  // Transaction hashes
  repeated string tx_hashes = 14 [ json_name = "tx_hashes" ];
  // Creation timestamp (ISO 8601 format)
  string created_at = 15 [ json_name = "created_at" ];
  // Last update timestamp (ISO 8601 format)
  string updated_at = 16 [ json_name = "updated_at" ];
  // Ethereum transaction hash (for the ETH chain transaction when withdrawal is
  // completed)
  string eth_tx_hash = 17 [ json_name = "eth_tx_hash" ];
}