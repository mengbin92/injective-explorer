syntax = "proto3";

package api.explorer.v1;

import "explorer/v1/common.proto";
import "google/api/annotations.proto";

option go_package = "injective-explorer/api/explorer/v1;v1";
option java_multiple_files = true;
option java_package = "api.explorer.v1";

// TagDefinitionService manages predefined tag definitions.
// This service provides CRUD operations for system-preset tags that can be used for addresses and contracts.
service TagDefinitionService {
  // ListTagDefinitions lists tag definitions with filters.
  rpc ListTagDefinitions(ListTagDefinitionsRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/tag/definitions"
    };
  }

  // CreateTagDefinition creates a new tag definition.
  rpc CreateTagDefinition(CreateTagDefinitionRequest) returns (Reply) {
    option (google.api.http) = {
      post: "/api/v1/tag/definition"
      body: "*"
    };
  }

  // UpdateTagDefinition updates an existing tag definition.
  rpc UpdateTagDefinition(UpdateTagDefinitionRequest) returns (Reply) {
    option (google.api.http) = {
      put: "/api/v1/tag/definition"
      body: "*"
    };
  }

  // DeleteTagDefinition deletes a tag definition.
  rpc DeleteTagDefinition(DeleteTagDefinitionRequest) returns (Reply) {
    option (google.api.http) = {
      delete: "/api/v1/tag/definition"
    };
  }

  // GetTagUsageStats gets usage statistics for tags.
  rpc GetTagUsageStats(GetTagUsageStatsRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/tag/usage-stats"
    };
  }

  // GetTagDefinitionsForSelection gets tag definitions for frontend selection.
  // This is used in contract/address tag forms to display available preset tags.
  rpc GetTagDefinitionsForSelection(GetTagDefinitionsForSelectionRequest) returns (Reply) {
    option (google.api.http) = {
      get: "/api/v1/tag/definitions/selection"
    };
  }
}

// Request messages

// ListTagDefinitionsRequest is the request message for listing tag definitions.
message ListTagDefinitionsRequest {
  string tag_type = 1 [json_name = "tag_type"];         // Tag type: address/contract (optional)
  string tag_category = 2 [json_name = "tag_category"]; // Tag category: normal/abnormal (optional)
  bool is_system = 3 [json_name = "is_system"];         // Whether system preset (optional)
  PaginationRequest pagination = 4;                     // Pagination parameters
}

// CreateTagDefinitionRequest is the request message for creating a tag definition.
message CreateTagDefinitionRequest {
  string tag_type = 1 [json_name = "tag_type"];         // Tag type: address/contract (required)
  string tag_name = 2 [json_name = "tag_name"];         // Tag name (required)
  string tag_category = 3 [json_name = "tag_category"]; // Tag category: normal/abnormal (required)
  string tag_color = 4 [json_name = "tag_color"];       // Tag color (optional)
  string description = 5;                                // Tag description (optional)
  int32 sort_order = 6 [json_name = "sort_order"];      // Sort order (optional)
  string created_by = 7 [json_name = "created_by"];      // Creator (optional)
}

// UpdateTagDefinitionRequest is the request message for updating a tag definition.
message UpdateTagDefinitionRequest {
  uint64 id = 1;                                        // Tag definition ID (required)
  string tag_name = 2 [json_name = "tag_name"];         // Tag name (optional)
  string tag_category = 3 [json_name = "tag_category"]; // Tag category (optional)
  string tag_color = 4 [json_name = "tag_color"];       // Tag color (optional)
  string description = 5;                                // Tag description (optional)
  int32 sort_order = 6 [json_name = "sort_order"];      // Sort order (optional)
}

// DeleteTagDefinitionRequest is the request message for deleting a tag definition.
message DeleteTagDefinitionRequest {
  uint64 id = 1;  // Tag definition ID (required)
}

// GetTagUsageStatsRequest is the request message for getting tag usage statistics.
message GetTagUsageStatsRequest {
  string tag_type = 1 [json_name = "tag_type"];  // Tag type: address/contract (optional)
}

// GetTagDefinitionsForSelectionRequest is the request message for getting tag definitions for selection.
message GetTagDefinitionsForSelectionRequest {
  string tag_type = 1 [json_name = "tag_type"];         // Tag type: address/contract (required)
  string tag_category = 2 [json_name = "tag_category"]; // Tag category: normal/abnormal (optional)
}

// Response data messages (used in Reply.data as Struct)

// TagDefinitionDTO represents tag definition information in the response.
message TagDefinitionDTO {
  uint64 id = 1;
  string tag_type = 2 [json_name = "tag_type"];         // Tag type: address/contract
  string tag_name = 3 [json_name = "tag_name"];         // Tag name
  string tag_category = 4 [json_name = "tag_category"]; // Tag category: normal/abnormal
  string tag_color = 5 [json_name = "tag_color"];       // Tag color
  string description = 6;                                // Tag description
  bool is_system = 7 [json_name = "is_system"];         // Whether system preset
  int32 usage_count = 8 [json_name = "usage_count"];    // Usage count
  int32 sort_order = 9 [json_name = "sort_order"];      // Sort order
  string created_by = 10 [json_name = "created_by"];    // Creator
  string created_at = 11 [json_name = "created_at"];    // Created timestamp
  string updated_at = 12 [json_name = "updated_at"];    // Updated timestamp
}

// TagUsageStatsDTO represents tag usage statistics.
message TagUsageStatsDTO {
  string tag_name = 1 [json_name = "tag_name"];     // Tag name
  int32 usage_count = 2 [json_name = "usage_count"]; // Usage count
  string tag_category = 3 [json_name = "tag_category"]; // Tag category: normal/abnormal
}
