syntax = "proto3";

package api.explorer.v1;

import "explorer/v1/common.proto";
import "google/api/annotations.proto";

option go_package = "injective-explorer/api/explorer/v1;v1";

// APITokenService provides API token management services
service APITokenService {
  // CreateToken creates a new API token
  rpc CreateToken(CreateTokenRequest) returns (Reply) {
    option (google.api.http) = {
      post : "/api/v1/tokens"
      body : "*"
    };
  }

  // ListTokens lists all tokens for a user
  rpc ListTokens(ListTokensRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/tokens"
    };
  }

  // DeleteToken deletes a token
  rpc DeleteToken(DeleteTokenRequest) returns (Reply) {
    option (google.api.http) = {
      delete : "/api/v1/tokens"
    };
  }

  // GetTokenUsage gets token usage statistics
  rpc GetTokenUsage(GetTokenUsageRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/tokens/usage"
    };
  }

  // GetDashboardStats gets dashboard statistics for a user
  rpc GetDashboardStats(GetDashboardStatsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/dashboard/stats"
    };
  }

  // ExportUsageLogs exports usage logs to Excel format
  rpc ExportUsageLogs(ExportUsageLogsRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/export/logs"
    };
  }

  // GetActiveTokenCount gets the count of active tokens for a user
  rpc GetActiveTokenCount(GetActiveTokenCountRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/tokens/active-count"
    };
  }

  // GetErrorCodeAnalysis gets error code analysis for a user or token
  rpc GetErrorCodeAnalysis(GetErrorCodeAnalysisRequest) returns (Reply) {
    option (google.api.http) = {
      get : "/api/v1/stats/error-analysis"
    };
  }
}

// CreateTokenRequest creates a new token
message CreateTokenRequest {
  string name = 1
      [ json_name = "name" ]; // Token name (required, 1-50 characters)
}

// CreateTokenResponse returns the created token
message CreateTokenResponse {
  string token = 1 [ json_name = "token" ]; // Full token (only shown once)
  string token_preview = 2
      [ json_name = "token_preview" ]; // Token preview (inj_xxx...xxx)
  int64 token_id = 3 [ json_name = "token_id" ]; // Token ID
  string message = 4 [ json_name = "message" ];  // Success message
}

// ListTokensRequest lists tokens
message ListTokensRequest {
  // Empty, uses authenticated user from context
}

// ListTokensResponse returns token list
message ListTokensResponse {
  repeated TokenInfo tokens = 1 [ json_name = "tokens" ];
}

// TokenInfo represents token information
message TokenInfo {
  int64 id = 1 [ json_name = "id" ];
  string name = 2 [ json_name = "name" ];
  string token_preview = 3 [ json_name = "token_preview" ]; // inj_xxx...xxx
  string plan_type = 4 [ json_name = "plan_type" ];         // free/paid
  string status = 5 [ json_name = "status" ];               // active/disabled
  string created_at = 6 [ json_name = "created_at" ];
  string last_used_at = 7 [ json_name = "last_used_at" ]; // Empty if never used
}

// DeleteTokenRequest deletes a token
message DeleteTokenRequest { int64 token_id = 1 [ json_name = "token_id" ]; }

// DeleteTokenResponse confirms deletion
message DeleteTokenResponse { string message = 1 [ json_name = "message" ]; }

// GetTokenUsageRequest gets token usage
message GetTokenUsageRequest { int64 token_id = 1 [ json_name = "token_id" ]; }

// GetTokenUsageResponse returns usage statistics
message GetTokenUsageResponse {
  int64 total_calls = 1 [ json_name = "total_calls" ];
  int64 success_calls = 2 [ json_name = "success_calls" ];
  int64 failed_calls = 3 [ json_name = "failed_calls" ];
  string last_used_at = 4 [ json_name = "last_used_at" ];
}

// GetDashboardStatsRequest gets dashboard statistics
message GetDashboardStatsRequest {
  int32 days = 1
      [ json_name = "days" ]; // Number of days to query (default: 30)
}

// GetDashboardStatsResponse returns dashboard statistics
message GetDashboardStatsResponse {
  int64 total_calls = 1 [ json_name = "total_calls" ]; // Total calls in period
  int64 success_calls = 2
      [ json_name = "success_calls" ]; // Success calls in period
  int64 failed_calls = 3
      [ json_name = "failed_calls" ]; // Failed calls in period
  int64 monthly_limit = 4 [ json_name = "monthly_limit" ]; // Monthly limit
  int64 monthly_used = 5 [ json_name = "monthly_used" ];   // Monthly used
  repeated DailyStats daily_stats = 6
      [ json_name = "daily_stats" ]; // Daily statistics
}

// DailyStats represents daily usage statistics
message DailyStats {
  string date = 1 [ json_name = "date" ]; // Date in YYYY-MM-DD format
  int64 total_calls = 2 [ json_name = "total_calls" ];
  int64 success_calls = 3 [ json_name = "success_calls" ];
  int64 failed_calls = 4 [ json_name = "failed_calls" ];
}

// ExportUsageLogsRequest exports usage logs
message ExportUsageLogsRequest {
  string time_range = 1
      [ json_name = "time_range" ]; // Optional: today/7days/30days/all
}

// ExportUsageLogsResponse returns Excel file download URL or direct data
message ExportUsageLogsResponse {
  string download_url = 1
      [ json_name = "download_url" ]; // Download URL (if using file storage)
  string message = 2 [ json_name = "message" ]; // Success message
}

// GetActiveTokenCountRequest gets active token count
message GetActiveTokenCountRequest {
  int32 days = 1 [ json_name = "days" ]; // Days threshold (default: 30)
}

// GetActiveTokenCountResponse returns active token count
message GetActiveTokenCountResponse {
  int32 total_tokens = 1 [ json_name = "total_tokens" ]; // Total tokens
  int32 active_tokens = 2 [ json_name = "active_tokens" ]; // Active tokens (used within N days)
}

// GetErrorCodeAnalysisRequest gets error code analysis
message GetErrorCodeAnalysisRequest {
  int64 token_id = 1 [ json_name = "token_id" ]; // Optional: filter by token
  int32 days = 2 [ json_name = "days" ]; // Days to query (default: 30)
}

// GetErrorCodeAnalysisResponse returns error code analysis
message GetErrorCodeAnalysisResponse {
  repeated ErrorCodeStats error_stats = 1 [ json_name = "error_stats" ];
  int64 total_errors = 2 [ json_name = "total_errors" ]; // Total error count
}

// ErrorCodeStats represents statistics for a specific error code
message ErrorCodeStats {
  int32 status_code = 1 [ json_name = "status_code" ]; // HTTP status code
  int64 count = 2 [ json_name = "count" ]; // Number of occurrences
  double percentage = 3 [ json_name = "percentage" ]; // Percentage of total errors
  string most_common_message = 4 [ json_name = "most_common_message" ]; // Most common error message
}
