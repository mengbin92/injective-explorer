services:
  injective-explorer:
    # image: injective-explorer:latest
    container_name: injective-explorer
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - 8000:8000
      - 9000:9000
    volumes:
      - ./configs:/data/conf
      - ./data/GeoLite2-City.mmdb:/data/GeoLite2-City.mmdb
    networks:
      - injective-explorer-network
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: 5
    depends_on:
      injective-explorer-mysql:
        condition: service_healthy
      injective-explorer-redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  envoy:
    image: envoyproxy/envoy:v1.36-latest
    container_name: injective-explorer-envoy
    restart: unless-stopped
    ports:
      - 9001:9001  # grpc-web 端口
      - 9901:9901  # Envoy admin 端口
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - injective-explorer-network
    depends_on:
      - injective-explorer
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --service-cluster envoy --service-node envoy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9901/server_info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      
  injective-explorer-redis:
    image: redis:8.4
    container_name: injective-explorer-redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - injective-explorer-redis:/data
    networks:
      - injective-explorer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  injective-explorer-mysql:
    image: mysql:8.0
    container_name: injective-explorer-mysql
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=jKBrZHGcsNG5fMc52EWz
      - MYSQL_DATABASE=explorer
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - injective-explorer-mysql:/var/lib/mysql
      - ./scripts/init_database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - injective-explorer-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pjKBrZHGcsNG5fMc52EWz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  minio:
    image: minio/minio:latest
    container_name: injective-explorer-minio
    restart: unless-stopped
    ports:
      - 19000:9000  # API 端口（避免与 injective-explorer gRPC 端口 9000 冲突）
      - 19001:9001  # Console 管理界面端口（避免与 envoy grpc-web 端口 9001 冲突）
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - injective-explorer-minio:/data
    networks:
      - injective-explorer-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

networks:
  injective-explorer-network:
    driver: bridge

volumes:
  injective-explorer-redis:
  injective-explorer-mysql:
  injective-explorer-minio: