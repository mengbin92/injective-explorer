services:
  injective-explorer:
    # image: injective-explorer:latest
    container_name: injective-explorer
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ENABLE_PPROF=false
    ports:
      - 8000:8000
      - 9000:9000
    volumes:
      - ./configs:/data/conf
    networks:
      - injective-explorer-network
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: 5
    depends_on:
      injective-explorer-mysql:
        condition: service_healthy
      injective-explorer-redis:
        condition: service_healthy
      
  injective-explorer-redis:
    image: redis:latest
    container_name: injective-explorer-redis
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - injective-explorer-redis:/data
    networks:
      - injective-explorer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  injective-explorer-mysql:
    image: mysql:8.0
    container_name: injective-explorer-mysql
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=jKBrZHGcsNG5fMc52EWz
      - MYSQL_DATABASE=explorer
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - injective-explorer-mysql:/var/lib/mysql
    networks:
      - injective-explorer-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pjKBrZHGcsNG5fMc52EWz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

networks:
  injective-explorer-network:
    driver: bridge

volumes:
  injective-explorer-redis:
  injective-explorer-mysql: