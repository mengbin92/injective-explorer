                    items:
                        type: string
                memo:
                    type: string
                tx_number:
                    type: string
                block_unix_timestamp:
                    type: string
                error_log:
                    type: string
                logs:
                    type: string
                claim_ids:
                    type: array
                    items:
                        type: string
                signer:
                    type: string
                to:
                    type: string
                value:
                    type: string
