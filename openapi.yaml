        api.explorer.v1.UploadContractFilesRequest:
            type: object
            properties:
                contract_address:
                    type: string
                    description: Contract address (required)
                chain_id:
                    type: string
                    description: 'Chain ID (optional, default: injective-1)'
                source_code:
                    type: string
                    description: Source code file (.sol) content as bytes (optional)
                    format: bytes
                source_code_file_name:
                    type: string
                    description: Source code file name (optional, e.g., "Token.sol")
                abi:
                    type: string
                    description: ABI file (.json) content as bytes (optional)
                    format: bytes
                abi_file_name:
                    type: string
                    description: ABI file name (optional, e.g., "abi.json")
                description:
                    type: string
                    description: Optional description
                uploaded_by:
                    type: string
                    description: User/address who uploaded the file (optional)
            description: |-
                UploadContractFilesRequest is the request message for uploading contract
                 files
tags:
    - name: APITokenService
      description: APITokenService provides API token management services
    - name: AddressLabelService
      description: |-
        AddressLabelService provides address label management services.
         This service allows users to add, edit, delete, and query labels for blockchain addresses.
    - name: AddressRemarkService
      description: |-
        AddressRemarkService manages address remarks.
         This service provides CRUD operations for address-level remarks (backend only, not visible in frontend explorer).
    - name: AdminService
      description: |-
        AdminService provides admin management services for API plans, IP management,
         and email blacklist
    - name: ContractInfoService
      description: |-
        ContractInfoService provides contract information query and management
         services. This service supports various contract types (token contracts, NFT
         contracts, etc.), with token contracts being the primary use case currently.
    - name: Explorer
    - name: TagDefinitionService
      description: |-
        TagDefinitionService manages predefined tag definitions.
         This service provides CRUD operations for system-preset tags that can be used for addresses and contracts.
    - name: WebhookService
      description: |-
        WebhookService provides webhook management (for paid tokens only).
         This service is reserved for future implementation.
