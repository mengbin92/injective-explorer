                    type: string
                    description: 'Update type: "new" or "update"'
                timestamp:
                    type: string
                    description: Timestamp of the update
        api.explorer.v1.UpdateContractInfoRequest:
            type: object
            properties:
                contractAddress:
                    type: string
                chainId:
                    type: string
                name:
                    type: string
                tokenName:
                    type: string
                tokenSymbol:
                    type: string
                contractType:
                    type: string
                verificationStatus:
                    type: string
                metadata:
                    type: object
                    additionalProperties:
                        type: string
        api.explorer.v1.UpdateEmailDomainRequest:
            type: object
            properties:
                id:
                    type: string
                status:
                    type: string
                note:
                    type: string
