                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.explorer.v1.CheckHealthyResponse'
    /api/v1/stream/account:
        get:
            tags:
                - Explorer
            description: Stream account updates (balance changes, new transactions, etc.)
            operationId: Explorer_StreamAccountUpdates
            parameters:
                - name: address
                  in: query
                  description: 'Required: account address to monitor'
                  schema:
                    type: string
                - name: fromTimestamp
                  in: query
                  description: |-
                    Optional: start streaming from a specific timestamp
                     If 0, streams from recent transactions
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.explorer.v1.AccountUpdate'
    /api/v1/stream/blocks:
        get:
            tags:
                - Explorer
            description: |-
                Streaming RPCs for real-time updates
                 Stream latest blocks as they are added to the chain
            operationId: Explorer_StreamLatestBlocks
            parameters:
                - name: fromHeight
                  in: query
                  description: |-
                    Optional: start streaming from a specific block height
                     If 0, streams from the latest blocks
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.explorer.v1.BlockUpdate'
    /api/v1/stream/transactions:
        get:
            tags:
                - Explorer
            description: Stream latest transactions as they are added to the chain
            operationId: Explorer_StreamLatestTransactions
            parameters:
                - name: types
                  in: query
                  description: |-
                    Optional: filter by transaction types
                     If empty, streams all transaction types
                  schema:
                    type: array
                    items:
                        type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.explorer.v1.TransactionUpdate'
