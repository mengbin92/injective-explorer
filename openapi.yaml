                - Explorer
            description: Get failed transactions in the last 24 hours with failure reasons
            operationId: Explorer_GetFailedTransactions24H
            parameters:
                - name: pagination.page
                  in: query
                  description: Page number, starts from 1, default 1 (for page-based pagination)
                  schema:
                    type: integer
                    format: int32
                - name: pagination.page_size
                  in: query
                  description: Page size, default 20, maximum 100
                  schema:
                    type: integer
                    format: int32
                - name: pagination.cursor
                  in: query
                  description: |-
                    Cursor (for cursor-based pagination, optimized for large datasets, takes priority over page)
                     For blocks: use block height (height)
                     For transactions: use transaction number (tx_number) or combination of block height + transaction number
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.explorer.v1.Reply'
