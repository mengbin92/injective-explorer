            operationId: Explorer_GetCW20Balance
            parameters:
                - name: address
                  in: query
                  description: Owner address to query balances for (required)
                  schema:
                    type: string
                - name: contract_address
                  in: query
                  description: 'Optional: filter by specific contract address'
                  schema:
                    type: string
                - name: non_zero_only
                  in: query
                  description: 'Optional: only return non-zero balances'
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.explorer.v1.Reply'
    /api/v1/webhooks:
        get:
            tags:
                - WebhookService
            description: ListWebhooks lists webhook configurations
            operationId: WebhookService_ListWebhooks
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
