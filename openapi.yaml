components:
    schemas:
        api.explorer.v1.AccountBalanceDTO:
            type: object
            properties:
                address:
                    type: string
                denom:
                    type: string
                amount:
                    type: string
        api.explorer.v1.AccountUpdate:
            type: object
            properties:
                address:
                    type: string
                    description: Account address
                update_type:
                    type: string
                    description: 'Update type: "transaction", "balance", etc.'
                data:
                    allOf:
                        - $ref: '#/components/schemas/api.explorer.v1.AccountUpdateData'
                    description: Update data using strongly-typed AccountUpdateData
                timestamp:
                    type: string
                    description: Timestamp of the update
        api.explorer.v1.AccountUpdateData:
            type: object
            properties:
                transaction:
                    allOf:
                        - $ref: '#/components/schemas/api.explorer.v1.TransactionDTO'
                    description: Transaction data if update_type is "transaction"
                balances:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.explorer.v1.AccountBalanceDTO'
                    description: Balance data if update_type is "balance"
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                    description: Additional metadata
            description: AccountUpdateData contains account update information
        api.explorer.v1.AddContractTagRequest:
            type: object
            properties:
                contractAddress:
                    type: string
                chainId:
                    type: string
                tagType:
                    type: string
                tagValue:
                    type: string
                tagColor:
                    type: string
                description:
                    type: string
                createdBy:
                    type: string
        api.explorer.v1.AddEmailDomainRequest:
            type: object
            properties:
                domain:
                    type: string
                status:
                    type: string
                note:
                    type: string
        api.explorer.v1.AddIPToBlacklistRequest:
            type: object
            properties:
                ip_address:
                    type: string
                reason:
                    type: string
                reason_text:
                    type: string
                block_type:
                    type: string
                operator_id:
                    type: string
                operator_name:
                    type: string
        api.explorer.v1.BatchAddIPToBlacklistRequest:
            type: object
            properties:
                ip_addresses:
                    type: array
                    items:
                        type: string
                reason:
                    type: string
                reason_text:
                    type: string
                block_type:
                    type: string
                operator_id:
                    type: string
                operator_name:
                    type: string
        api.explorer.v1.BatchImportEmailDomainsRequest:
            type: object
            properties:
                domains:
                    type: array
                    items:
                        type: string
        api.explorer.v1.BatchRemoveIPFromBlacklistRequest:
            type: object
            properties:
                ip_addresses:
                    type: array
                    items:
                        type: string
        api.explorer.v1.BlockDTO:
            type: object
            properties:
                height:
                    type: string
                proposer:
                    type: string
                moniker:
                    type: string
                block_hash:
                    type: string
                parent_hash:
                    type: string
                num_precommits:
                    type: string
                num_txs:
                    type: string
                total_txs:
                    type: string
                txs:
                    type: array
                    items:
                        type: object
                timestamp:
                    type: string
                block_unix_timestamp:
                    type: string
        api.explorer.v1.BlockUpdate:
            type: object
            properties:
                block:
                    allOf:
                        - $ref: '#/components/schemas/api.explorer.v1.BlockDTO'
                    description: Block data using strongly-typed BlockDTO
                update_type:
                    type: string
                    description: 'Update type: "new" or "update"'
                timestamp:
                    type: string
                    description: Timestamp of the update
            description: Streaming response messages
        api.explorer.v1.CheckHealthyResponse:
            type: object
            properties:
                status:
                    type: string
                    description: 'Health status: "healthy", "degraded", "unhealthy"'
                service:
                    type: string
                    description: Service name
                timestamp:
                    type: string
                    description: Timestamp of the health check
                details:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/api.explorer.v1.HealthDetails'
                    description: Health details for each component (database, redis, etc.)
            description: CheckHealthyResponse contains the health status of the service
        api.explorer.v1.CreateContractInfoRequest:
            type: object
            properties:
                contractAddress:
                    type: string
                name:
                    type: string
                tokenName:
                    type: string
                tokenSymbol:
                    type: string
                contractType:
                    type: string
                chainId:
                    type: string
                verificationStatus:
                    type: string
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                tags:
                    type: array
                    items:
                        type: string
            description: Request messages
        api.explorer.v1.CreateTokenRequest:
            type: object
            properties:
                name:
                    type: string
            description: CreateTokenRequest creates a new token
        api.explorer.v1.CreateWebhookRequest:
            type: object
            properties:
                token_id:
                    type: string
                webhook_url:
                    type: string
                events:
                    type: array
                    items:
                        type: string
            description: CreateWebhookRequest creates a webhook
        api.explorer.v1.EVMLogDTO:
            type: object
            properties:
                address:
                    type: string
                topics:
                    type: array
                    items:
                        type: string
                data:
                    type: string
                block_number:
                    type: string
                tx_hash:
                    type: string
                tx_index:
                    type: integer
                    format: uint32
                log_index:
                    type: integer
                    format: uint32
            description: EVMLogDTO represents an EVM event log
        api.explorer.v1.EVMTransactionDTO:
            type: object
            properties:
                hash:
                    type: string
                block_number:
                    type: string
                block_timestamp:
                    type: string
                from:
                    type: string
                to:
                    type: string
                value:
                    type: string
                nonce:
                    type: string
                gas_price:
                    type: string
                gas_limit:
                    type: string
                gas_used:
                    type: string
                input_data:
                    type: string
                contract_address:
                    type: string
                method_id:
                    type: string
                method_name:
                    type: string
                status:
                    type: string
                logs:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.explorer.v1.EVMLogDTO'
                transaction_fee:
                    type: string
                is_contract_call:
                    type: boolean
                is_contract_create:
                    type: boolean
            description: EVMTransactionDTO represents an EVM transaction in Etherscan-like format
        api.explorer.v1.HealthDetails:
            type: object
            properties:
                status:
                    type: string
                    description: 'Component status: "healthy", "unhealthy", "unavailable", "not_configured"'
                error:
                    type: string
                    description: Optional error message if component is unhealthy
                latencyMs:
                    type: number
                    description: Optional latency in milliseconds
                    format: double
            description: HealthDetails contains detailed health information for each component
        api.explorer.v1.Reply:
            type: object
            properties:
                code:
                    type: integer
                    description: 响应状态码，0表示成功，非0表示失败
                    format: int32
                message:
                    type: string
                    description: 响应消息
                data:
                    type: object
                    description: 响应数据（使用 Struct 类型，可以直接返回 JSON 对象，更直观）
            description: 通用响应结构
        api.explorer.v1.ToggleEmailDomainStatusRequest:
            type: object
            properties:
                id:
                    type: string
        api.explorer.v1.TransactionDTO:
            type: object
            properties:
                id:
                    type: string
                block_number:
                    type: string
                block_timestamp:
                    type: string
                hash:
                    type: string
                code:
                    type: integer
                    format: uint32
                data:
                    type: string
                info:
                    type: string
                gas_wanted:
                    type: string
                gas_used:
                    type: string
                gas_fee:
                    type: string
                codespace:
                    type: string
                events:
                    type: array
                    items:
                        type: string
                tx_type:
                    type: string
                messages:
                    type: string
                signatures:
