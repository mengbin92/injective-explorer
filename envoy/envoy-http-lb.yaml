# Envoy HTTP 负载均衡配置（替代 Nginx 的方案）
# 如果不想使用 Nginx，可以使用 Envoy 同时处理 HTTP 和 gRPC

admin:
  address:
    socket_address:
      protocol: TCP
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    # HTTP API 负载均衡监听器
    - name: http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: http_route
                  virtual_hosts:
                    - name: http_backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: http_service
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # gRPC-Web 负载均衡监听器
    - name: grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9001
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_grpc
                codec_type: AUTO
                stream_idle_timeout: 0s
                request_timeout: 0s
                request_headers_timeout: 0s
                route_config:
                  name: grpc_route
                  virtual_hosts:
                    - name: grpc_backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: grpc_service
                            timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match:
                                - safe_regex:
                                    regex: ".*"
                              allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
                              allow_headers: >
                                keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,
                                x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,
                                x-grpc-web,grpc-timeout
                              expose_headers: "grpc-status,grpc-message"
                              allow_credentials: false
                              max_age: "1728000"
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # HTTP API 服务集群
    - name: http_service
      connect_timeout: 0.25s
      # 使用 STRICT_DNS 类型支持多个 DNS 端点负载均衡
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: round_robin
      # 或者使用 least_request: 最少连接数
      # lb_policy: least_request
      load_assignment:
        cluster_name: http_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: injective-explorer-1
                      port_value: 8000
              - endpoint:
                  address:
                    socket_address:
                      address: injective-explorer-2
                      port_value: 8000
              - endpoint:
                  address:
                    socket_address:
                      address: injective-explorer-3
                      port_value: 8000
      health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: /api/v1/health
            expected_statuses:
              - start: 200
                end: 299
          no_traffic_interval: 60s
          interval_jitter: 1s

    # gRPC 服务集群
    - name: grpc_service
      connect_timeout: 0.25s
      # 使用 STRICT_DNS 类型支持多个 DNS 端点负载均衡
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: round_robin
      http2_protocol_options:
        max_concurrent_streams: 100
        initial_stream_window_size: 65536
        initial_connection_window_size: 1048576
      upstream_connection_options:
        tcp_keepalive:
          keepalive_probes: 3
          keepalive_time: 30
          keepalive_interval: 5
      health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          grpc_health_check:
            service_name: ""
          no_traffic_interval: 60s
          interval_jitter: 1s
      load_assignment:
        cluster_name: grpc_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: injective-explorer-1
                      port_value: 9000
              - endpoint:
                  address:
                    socket_address:
                      address: injective-explorer-2
                      port_value: 9000
              - endpoint:
                  address:
                    socket_address:
                      address: injective-explorer-3
                      port_value: 9000

