# ========== 通用 gRPC-Web / gRPC 反向代理配置 ==========
# 文件名：grpc-proxy-443.conf
# 适用：任何域名，只要证书文件放在约定目录即可
# 证书命名规则：/etc/nginx/sslV2/${host}/fullchain.cer
#              /etc/nginx/sslV2/${host}/cert.key
# ========================================================

server {
    listen 443 ssl http2;
    # 不写 server_name，匹配所有请求

    # 动态证书：根据 SNI 的 $ssl_server_name 变量加载对应目录证书
    ssl_certificate     /etc/nginx/sslV2/$ssl_server_name/fullchain.cer;
    ssl_certificate_key /etc/nginx/sslV2/$ssl_server_name/cert.key;

    # 兼容性优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ========== CORS 统一由 Nginx 返回 ==========
    add_header Access-Control-Allow-Origin  "$http_origin" always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout" always;
    add_header Access-Control-Expose-Headers "grpc-status,grpc-message" always;
    add_header Access-Control-Max-Age 1728000 always;

    # 预检请求直接 204
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ========== 反向代理到后端 Envoy / 原生 gRPC ==========
    location / {
        grpc_pass grpc://localhost:9001;   # 与 Envoy listener 端口一致
        # 如果后端是明文 h2c 而非 grpc://，改用：
        # grpc_pass http://localhost:9000;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;

        # 长连接 / 流式超时
        grpc_connect_timeout 60s;
        grpc_send_timeout    60s;
        grpc_read_timeout    60s;
    }

    # 友好错误页（可选）
    error_page 404 /404.html;
    location = /404.html { internal; }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }
}
