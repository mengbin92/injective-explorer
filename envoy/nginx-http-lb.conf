# Nginx HTTP 负载均衡配置
# 用于 HTTP API 服务的负载均衡

upstream explorer_http {
    # 负载均衡策略：least_conn（最少连接数）
    # 可选：round_robin（轮询）、ip_hash（基于IP的会话保持）
    least_conn;
    
    # 后端服务实例
    server injective-explorer-1:8000 max_fails=3 fail_timeout=30s weight=1;
    server injective-explorer-2:8000 max_fails=3 fail_timeout=30s weight=1;
    server injective-explorer-3:8000 max_fails=3 fail_timeout=30s weight=1;
    
    # 保持连接池，提高性能
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    
    # 访问日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # 请求体大小限制
    client_max_body_size 10M;
    
    # 超时配置
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    location / {
        proxy_pass http://explorer_http;
        
        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 连接池优化
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # 健康检查
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }
    
    # 健康检查端点（可选，用于监控）
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

