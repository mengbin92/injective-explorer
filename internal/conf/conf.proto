syntax = "proto3";
package kratos.api;

option go_package = "injective-explorer/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Node node = 3;
  Log log = 4;
  Chain chain = 5;
  Sync sync = 6;
  Archive archive = 7;
  TokenPrice token_price = 8;       // Token price service configuration
  APIManagement api_management = 9; // API management configuration
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  bool enable_swagger = 3;
  bool enable_cors = 4; // Whether to enable CORS handling in code (default
                        // false, because Nginx/Envoy already handles it)
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string addr = 1;
    string password = 2;
    int32 db = 3;
    int32 pool_size = 4;
    google.protobuf.Duration read_timeout = 5;
    google.protobuf.Duration write_timeout = 6;
  }
  message ObjectStorage {
    string provider = 1;          // "s3", "oss", "cos", "minio"
    string endpoint = 2;          // Object storage endpoint
    string access_key_id = 3;     // Access key ID
    string secret_access_key = 4; // Secret access key
    string bucket_name = 5;       // Bucket name
    string region = 6;            // Region (required for S3/OSS)
    bool use_ssl = 7;             // Whether to use SSL
    string path_prefix = 8;       // Path prefix, e.g., "transactions/"
    bool enabled = 9; // Whether to enable object storage (default false, for
                      // backward compatibility)
  }
  Database database = 1;
  Redis redis = 2;
  ObjectStorage object_storage = 3;
}

message Node {
  string rpc_node = 1;
  string grpc_node = 2;
  string chain_id = 3;
}

message Log {
  // Log level setting
  // Supports debug(-1), info(0), warn(1), error(2), dpanic(3), panic(4),
  // fatal(5)
  int32 level = 1;
  // Log output format, supports json or console
  string format = 2;
}

message Chain {
  string network = 1;
  string lcd_endpoint = 2;
  string tm_endpoint = 3;
  string chain_grpc_endpoint = 4;
  string chain_stream_grpc_endpoint = 5;
  string exchange_grpc_endpoint = 6;
  string explorer_grpc_endpoint = 7;
  string chain_id = 8;
  string fee_denom = 9;
  string name = 10;
  string official_tokens_list_url = 11;
  EVM evm = 12; // EVM RPC configuration

  message EVM {
    bool enabled = 1;        // Whether EVM support is enabled
    string rpc_endpoint = 2; // EVM JSON-RPC endpoint
    string ws_endpoint = 3;  // EVM WebSocket endpoint
    int64 chain_id = 4; // EVM chain ID (1776 for mainnet, 1439 for testnet)
    google.protobuf.Duration timeout = 5; // RPC timeout
    Retry retry = 6;                      // Retry configuration

    message Retry {
      int32 max_attempts = 1;                     // Maximum retry attempts
      google.protobuf.Duration initial_delay = 2; // Initial retry delay
    }
  }
}

message Sync {
  Redis redis = 1;
  Intervals intervals = 2;
  Timeouts timeouts = 3;
  Concurrency concurrency = 4;
  BatchSize batch_size = 5;
  Retry retry = 6;
  Blocks blocks = 7;

  message Redis {
    string queue_key = 1; // Redis queue key name
  }

  message Intervals {
    google.protobuf.Duration block_poll = 1;
    google.protobuf.Duration tx_process = 2;
    google.protobuf.Duration historical_sync = 3;
    google.protobuf.Duration historical_batch_delay = 4;
    google.protobuf.Duration backward_sync_log = 5;
    google.protobuf.Duration rpc_status_retry = 6;
  }

  message Timeouts { google.protobuf.Duration block_query = 1; }

  message Concurrency {
    int32 tx_processors = 1;
    int32 backward_sync_workers = 2;
    int32 historical_sync_workers = 3;
  }

  message BatchSize {
    int32 backward_sync = 1;
    int32 historical_sync = 2;
    int32 missing_block_check = 3;
    int32 backward_sync_log = 4;
    int32 tx_batch = 5; // Transaction batch size for batch processing
  }

  message Retry {
    int32 max_attempts = 1;
    google.protobuf.Duration initial_delay = 2;
  }

  message Blocks { uint64 earliest_height = 1; }
}

message Archive {
  // Archive age in months before transactions are archived (default: 6)
  int32 age_months = 1;
  // Batch size for archiving transactions (default: 1000)
  int32 batch_size = 2;
  // Storage threshold in bytes for uploading to object storage (default: 10KB)
  int32 storage_threshold = 3;
  // Whether to use object storage for large fields (default: auto-detect)
  bool use_object_storage = 4;
  // Archive execution interval (default: 24h)
  google.protobuf.Duration interval = 5;
  // Whether to enable automatic archiving (default: false)
  bool enabled = 6;
}

message TokenPrice {
  // Default token configuration (used when no token is specified)
  TokenConfig default_token = 1;
  // Map of token symbols to their configurations
  // Key: token symbol (e.g., "inj", "mycoin")
  // Value: token configuration
  map<string, TokenConfig> tokens = 2;
  // Price cache TTL (default: 5 minutes)
  google.protobuf.Duration price_cache_ttl = 3;
  // Supply cache TTL (default: 1 hour)
  google.protobuf.Duration supply_cache_ttl = 4;
}

message TokenConfig {
  // Token symbol (e.g., "inj", "mycoin")
  string symbol = 1;
  // Token denom on chain (e.g., "inj", "mycoin")
  string denom = 2;
  // CoinGecko API coin ID (e.g., "injective-protocol", "my-token")
  // If empty, price fetching will be disabled for this token
  string coingecko_id = 3;
  // Number of decimal places (default: 18, like Ethereum/Injective)
  int32 decimals = 4;
  // Price source: "coingecko", "custom", etc. (default: "coingecko")
  string price_source = 5;
  // Custom price API URL (optional, used when price_source is "custom")
  // Should return JSON with "price" and "change_24h" fields
  string custom_price_url = 6;
  // Display name for the token (e.g., "Injective", "My Token")
  string display_name = 7;
}

message APIManagement {
  RateLimit rate_limit = 1;
  UsageStats usage_stats = 2;
  IPLocation ip_location = 3;
  ArchiveUsage archive_usage = 4;
  IPWhitelist ip_whitelist = 5; // IP whitelist configuration

  message RateLimit {
    int32 ip_per_minute = 1;         // IP rate limit per minute
    int32 ip_per_hour = 2;           // IP rate limit per hour
    int32 token_per_second = 3;      // Token rate limit per second
    int32 default_monthly_limit = 4; // Default monthly limit
  }

  message UsageStats {
    int32 async_delay_seconds = 1; // Async statistics delay (1-5 seconds)
    int32 archive_days = 2; // Archive retention period in days (default: 90)
  }

  message IPLocation {
    string geoip_db_path = 1; // GeoIP2 database file path
  }

  message ArchiveUsage {
    bool enabled = 1;
    google.protobuf.Duration interval = 2;
    int32 batch_size = 3;
  }

  message IPWhitelist {
    // List of IP addresses or CIDR ranges to whitelist
    // Whitelisted IPs bypass token authentication and rate limiting
    // Examples: "127.0.0.1", "192.168.1.0/24", "::1", "2001:db8::/32"
    repeated string ips = 1;
  }
}
