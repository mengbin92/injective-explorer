syntax = "proto3";
package kratos.api;

option go_package = "injective-explorer/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Node node = 3;
  Log log = 4;
  Chain chain = 5;
  Sync sync = 6;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  bool enable_swagger = 3;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string addr = 1;
    string password = 2;
    int32 db = 3;
    int32 pool_size = 4;
    google.protobuf.Duration read_timeout = 5;
    google.protobuf.Duration write_timeout = 6;
  }
  message ObjectStorage {
    string provider = 1;          // "s3", "oss", "cos", "minio"
    string endpoint = 2;          // 对象存储端点
    string access_key_id = 3;     // 访问密钥ID
    string secret_access_key = 4; // 访问密钥
    string bucket_name = 5;       // 存储桶名称
    string region = 6;            // 区域（S3/OSS需要）
    bool use_ssl = 7;             // 是否使用SSL
    string path_prefix = 8;       // 路径前缀，如 "transactions/"
    bool enabled = 9;             // 是否启用对象存储（默认false，向后兼容）
  }
  Database database = 1;
  Redis redis = 2;
  ObjectStorage object_storage = 3;
}

message Node {
  string rpc_node = 1;
  string grpc_node = 2;
  string chain_id = 3;
}

message Log {
  // 日志级别设置
  // 支持debug(-1)、info(0)、warn(1)、error(2)、dpanic(3)、panic(4)、fatal(5)
  int32 level = 1;
  // 日志输出格式，支持json or console
  string format = 2;
}

message Chain {
  string network = 1;
  string lcd_endpoint = 2;
  string tm_endpoint = 3;
  string chain_grpc_endpoint = 4;
  string chain_stream_grpc_endpoint = 5;
  string exchange_grpc_endpoint = 6;
  string explorer_grpc_endpoint = 7;
  string chain_id = 8;
  string fee_denom = 9;
  string name = 10;
  string official_tokens_list_url = 11;
}

message Sync {
  Redis redis = 1;
  Intervals intervals = 2;
  Timeouts timeouts = 3;
  Concurrency concurrency = 4;
  BatchSize batch_size = 5;
  Retry retry = 6;
  Blocks blocks = 7;

  message Redis {
    string queue_key = 1; // Redis 队列键名
  }

  message Intervals {
    google.protobuf.Duration block_poll = 1;
    google.protobuf.Duration tx_process = 2;
    google.protobuf.Duration historical_sync = 3;
    google.protobuf.Duration historical_batch_delay = 4;
    google.protobuf.Duration backward_sync_log = 5;
    google.protobuf.Duration rpc_status_retry = 6;
    google.protobuf.Duration validator_sync = 7; // Validator 同步间隔
  }

  message Timeouts { google.protobuf.Duration block_query = 1; }

  message Concurrency {
    int32 tx_processors = 1;
    int32 backward_sync_workers = 2;
    int32 historical_sync_workers = 3;
  }

  message BatchSize {
    int32 backward_sync = 1;
    int32 historical_sync = 2;
    int32 missing_block_check = 3;
    int32 backward_sync_log = 4;
  }

  message Retry {
    int32 max_attempts = 1;
    google.protobuf.Duration initial_delay = 2;
  }

  message Blocks { uint64 earliest_height = 1; }
}
