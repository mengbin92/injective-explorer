server:
  http:
    addr: 0.0.0.0:${HTTP_PORT:8000}
    timeout: 30s
  grpc:
    addr: 0.0.0.0:${GRPC_PORT:9000}
    timeout: 30s
  enable_swagger: true
  # 默认值，CORS由Nginx/Envoy处理，开发环境可设置为true，代码中处理CORS
  enable_cors: true

data:
  database:
    driver: mysql
    source: ${DB_USER:root}:${DB_PASSWORD:jKBrZHGcsNG5fMc52EWz}@tcp(${DB_HOST:localhost}:${DB_PORT:3306})/${DB_NAME:explorer}?charset=utf8mb4&parseTime=True&loc=Local
  redis:
    addr: ${REDIS_HOST:localhost}:${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    db: ${REDIS_DB:0}
    pool_size: 100
    read_timeout: 0.2s
    write_timeout: 0.2s
  object_storage:
    enabled: true # 测试时启用，生产环境根据需要设置
    provider: ${OBJECT_STORAGE_PROVIDER:minio} # s3, oss, cos, minio
    endpoint: ${OBJECT_STORAGE_ENDPOINT:localhost:19000}
    access_key_id: ${OBJECT_STORAGE_ACCESS_KEY:minioadmin}
    secret_access_key: ${OBJECT_STORAGE_SECRET_KEY:minioadmin}
    bucket_name: ${OBJECT_STORAGE_BUCKET:injective-explorer}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    use_ssl: false
    path_prefix: ${OBJECT_STORAGE_PATH_PREFIX:transactions/}
    # 对象存储操作超时（默认: 10s）
    timeout: 10s
    # 读取超时（默认: 5s）
    read_timeout: 5s

log:
  # 支持debug(-1)、info(0)、warn(1)、error(2)、dpanic(3)、panic(4)、fatal(5)
  level: 2
  # json or console
  format: console

chain:
  network: mainnet
  lcd_endpoint: https://sentry.lcd.injective.network
  tm_endpoint: https://sentry.tm.injective.network:443
  chain_grpc_endpoint: sentry.chain.grpc.injective.network:443
  chain_stream_grpc_endpoint: sentry.chain.stream.injective.network:443
  exchange_grpc_endpoint: sentry.exchange.grpc.injective.network:443
  explorer_grpc_endpoint: sentry.explorer.grpc.injective.network:443
  chain_id: injective-1
  fee_denom: inj
  name: mainnet
  official_tokens_list_url: https://github.com/InjectiveLabs/injective-lists/raw/master/json/tokens/testnet.json
  # EVM RPC 配置
  evm:
    enabled: true
    rpc_endpoint: https://sentry.evm-rpc.injective.network/
    ws_endpoint: wss://sentry.evm-ws.injective.network
    chain_id: 1776
    timeout: 10s
    # API 查询超时（默认: 15s，比 RPC timeout 长以适应详情查询）
    api_timeout: 15s
    retry:
      max_attempts: 3
      initial_delay: 2s
    # EVM details 缓存配置
    cache:
      # Redis 缓存 TTL（默认: 24h）
      ttl: 24h
      # 是否启用缓存（默认: true）
      enabled: true

sync:
  # Redis 队列配置
  redis:
    queue_key: "tx:hash:queue"

  # 时间间隔配置
  intervals:
    block_poll: 5s # 区块轮询间隔
    tx_process: 1s # 交易处理间隔
    historical_sync: 10s # 历史区块同步间隔
    historical_batch_delay: 1s # 历史同步批次延迟
    backward_sync_log: 10s # 向后同步进度日志时间间隔
    rpc_status_retry: 5s # RPC 状态获取失败重试延迟

  # 超时配置
  timeouts:
    block_query: 30s # 区块查询超时

  # 并发配置
  concurrency:
    tx_processors: 5 # 并发交易处理器数量
    backward_sync_workers: 5 # 向后同步工作线程数
    historical_sync_workers: 2 # 历史同步工作线程数

  # 批次大小配置
  batch_size:
    backward_sync: 10 # 向后同步批次大小
    historical_sync: 5 # 历史同步批次大小
    missing_block_check: 100 # 查找缺失区块的批次大小
    backward_sync_log: 100 # 向后同步进度日志间隔（每 N 个区块）
    tx_batch: 50 # 交易批量处理批次大小（与区块同步速度保持一致）

  # 重试配置
  retry:
    max_attempts: 3 # 最大重试次数
    initial_delay: 2s # 初始重试延迟

  # 区块配置
  blocks:
    earliest_height: 147347723 # 最早区块高度的默认值

archive:
  # 是否启用自动归档（默认: false）
  enabled: false
  # 归档执行间隔（默认: 24h = 86400s），使用秒数格式，例如: 86400s (24h), 43200s (12h), 3600s (1h)
  interval: ${ARCHIVE_INTERVAL:600s}
  # 归档周期（月），归档此时间之前的交易数据（默认: 6）
  age_months: ${ARCHIVE_AGE_MONTHS:6}
  # 批次大小，每批处理的交易数量（默认: 1000）
  batch_size: ${ARCHIVE_BATCH_SIZE:1000}
  # 存储阈值（字节），基于压缩后数据大小判断，超过此大小的字段会上传到对象存储（默认: 3KB）
  # 注意：判断基于压缩后的数据大小（实际数据库存储大小），而不是原始数据大小
  # 3KB 的选择平衡了数据库性能（TEXT字段>3KB可能影响查询性能）和存储成本（对象存储通常比数据库存储更便宜）
  storage_threshold: ${ARCHIVE_STORAGE_THRESHOLD:512}
  # 是否使用对象存储，true=使用对象存储，false=存储在数据库，不设置则自动检测
  use_object_storage: true

# Token price service configuration
# Supports multiple tokens and custom chains
token_price:
  # Default token (used when token_symbol is not specified)
  default_token:
    symbol: "inj"
    denom: "inj"
    coingecko_id: "injective-protocol"
    decimals: 18
    price_source: "coingecko"
    display_name: "Injective"

  # Multiple token configurations
  tokens:
    # Injective mainnet token
    inj:
      symbol: "inj"
      denom: "inj"
      coingecko_id: "injective-protocol"
      decimals: 18
      price_source: "coingecko"
      display_name: "Injective"

    # Example: Custom token on your own chain (using CoinGecko)
    # mycoin:
    #   symbol: "mycoin"
    #   denom: "mycoin"
    #   coingecko_id: "my-token-id"  # CoinGecko coin ID
    #   decimals: 18
    #   price_source: "coingecko"
    #   display_name: "My Token"

    # Example: Custom token with custom price API
    # customtoken:
    #   symbol: "customtoken"
    #   denom: "customtoken"
    #   decimals: 18
    #   price_source: "custom"
    #   custom_price_url: "https://api.example.com/price/customtoken"
    #   display_name: "Custom Token"

  # Cache TTL (optional, defaults: 300s for price, 3600s for supply)
  # Note: Duration format must be in seconds (e.g., "300s" for 5 minutes, "3600s" for 1 hour)
  price_cache_ttl: 300s
  supply_cache_ttl: 3600s

# API management configuration
api_management:
  # Rate limit configuration
  rate_limit:
    ip_per_minute: 100 # IP rate limit per minute
    ip_per_hour: 5000 # IP rate limit per hour
    token_per_second: 5 # Token rate limit per second
    default_monthly_limit: 100000 # Default monthly limit

  # Usage statistics configuration
  usage_stats:
    async_delay_seconds: 2 # Async statistics delay (1-5 seconds)
    archive_days: 90 # Archive retention period in days (default: 90)

  # IP location configuration (optional)
  ip_location:
    geoip_db_path: /data/GeoLite2-City.mmdb

  # Archive usage configuration
  archive_usage:
    enabled: false
    interval: 86400s
    batch_size: 1000

  # IP whitelist configuration
  # Whitelisted IPs bypass token authentication and rate limiting
  # Supports individual IP addresses and CIDR ranges (IPv4 and IPv6)
  # Examples:
  #   - "127.0.0.1"           # Localhost IPv4
  #   - "::1"                 # Localhost IPv6
  #   - "192.168.1.0/24"      # IPv4 CIDR range
  #   - "2001:db8::/32"       # IPv6 CIDR range
  ip_whitelist:
    ips:
      - 127.0.0.1
      - ::1
      - 106.3.198.222
      - 192.168.65.1
